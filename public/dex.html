<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Opendex</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root { --dex: #e5484d; }
  .hero .progress { width: 180px; margin: 6px 0 0 auto; }
  .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .type { display: grid; grid-template-columns: 72px 1fr; gap: 4px 14px; padding: 12px 14px; background: var(--surface); border: var(--bw) solid var(--line); border-top: 6px solid var(--c); border-radius: var(--r-lg); }
  .type img { grid-row: span 4; width: 72px; height: 72px; object-fit: contain; align-self: center; }
  .type img.unseen { filter: grayscale(1) brightness(0.25); opacity: 0.6; }
  .type h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .type p { margin: 0; font-size: 13px; }
  .type .flavor { color: var(--muted); font-style: italic; }
  .type .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .type-chip { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 99px; background: var(--c); color: var(--on, #2a2140); font: 600 12px/1.6 var(--font-display); box-shadow: 0 0 0 1.5px var(--outline); }
  .type.hidden-type { --c: var(--sunken); border-style: dashed; border-top-style: solid; }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12.5px; }
  .line span.cur { font-weight: 800; text-decoration: underline; text-decoration-color: var(--c); text-decoration-thickness: 2px; }
  .line i { color: var(--muted); font-style: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
  /* Phones: two per row, so a form never fills the whole screen. */
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .name { font-size: 14px; } }
  .cell { background: var(--surface); border: var(--bw) solid color-mix(in srgb, var(--type) 40%, var(--line)); border-radius: var(--r-lg); padding: 6px 6px 10px; text-align: center; cursor: pointer; position: relative; font: inherit; color: inherit; box-shadow: var(--gloss); transition: transform 0.08s ease, border-color 0.12s ease; }
  .cell .stage { margin-bottom: 6px; }
  .cell:hover, .cell:focus-visible { border-color: var(--outline); transform: translateY(-2px); box-shadow: var(--lift), var(--gloss); outline: none; }
  .cell.current { border-color: var(--outline); box-shadow: var(--lift), 0 0 0 3px color-mix(in srgb, var(--dex) 45%, transparent); }
  .cell.unseen { --type: var(--sunken); --type-ink: var(--line); background: var(--surface-2); }
  .cell.unseen .name { color: var(--muted); }
  .cell[hidden] { display: none; }
  /* Types as a row of filters; the one picked explains itself above the grid. */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .filters button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border: var(--bw) solid color-mix(in srgb, var(--type) 55%, var(--line)); border-radius: 99px; background: var(--surface); color: var(--ink); font: 600 13px var(--font-display); cursor: pointer; }
  .filters button img { width: 24px; height: 24px; object-fit: contain; }
  .filters button.all { padding-left: 12px; }
  .filters button[aria-pressed="true"] { background: var(--type); color: var(--type-on); border-color: var(--type-ink); box-shadow: var(--lift-sm); }
  /* "All" has no type colour of its own: the brand, with ink that reads on it. */
  .filters button.all[aria-pressed="true"], .filters button:not([data-type])[aria-pressed="true"], .filters button[data-type=""][aria-pressed="true"] { background: var(--brand-ink); color: var(--bg); }
  .type-info { display: grid; grid-template-columns: 96px 1fr; gap: 6px 16px; align-items: center; margin: 0 0 14px; padding: 12px 16px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--type) 14%, var(--surface)); border: var(--bw) solid color-mix(in srgb, var(--type) 50%, var(--line)); box-shadow: var(--gloss); }
  .type-info[hidden] { display: none; }
  .type-info img { grid-row: span 3; width: 96px; height: 96px; object-fit: contain; }
  .type-info img.unseen { filter: grayscale(1) brightness(0.25); opacity: 0.6; }
  .type-info p { margin: 0; font-size: 13.5px; }
  .type-info .flavor { color: var(--muted); font-style: italic; }
  .type-info .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .no { position: absolute; left: 10px; top: 8px; font: 600 12px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
  .you { position: absolute; right: 8px; top: 7px; font: 600 12px/1.6 var(--font-display); background: #b8282e; color: #fff; border-radius: 99px; padding: 0 8px; }
  canvas { width: 100%; aspect-ratio: 1; display: block; }
  .name { font: 600 15px var(--font-display); }
  .sub { display: block; min-height: 2.6em; line-height: 1.3; font-size: 12px; color: var(--muted); }
  dialog { border: 2.5px solid var(--outline); border-radius: 20px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 6px 0 var(--outline); }
  dialog::backdrop { background: rgba(20, 14, 30, 0.55); backdrop-filter: blur(2px); }
  .detail { padding: 16px 20px 20px; text-align: center; }
  .detail .stage { margin: 0 auto 8px; width: 240px; }
  .detail canvas { width: 220px; margin: 0 auto; }
  .detail h3 { margin: 4px 0 2px; font-size: 24px; }
  .detail .text { margin: 12px 0 10px; text-align: left; }
  .detail .types-row { display: flex; justify-content: center; gap: 6px; margin: 6px 0 2px; }
  .detail .how { text-align: left; margin: 0 0 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 13px; }
  .detail .how b { font-family: var(--font-display); font-weight: 600; }
  .detail .line { justify-content: flex-start; margin: 0 0 14px; }
  .hof { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .hof .empty { grid-column: 1 / -1; text-align: left; padding: 4px 0; max-width: 60ch; }
  .hof div { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding-bottom: 48px; }
  .badge { display: flex; gap: 10px; align-items: center; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
  .badge .medal { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: var(--sun); color: #2a2140; box-shadow: 0 0 0 2px var(--outline), 0 2px 0 2px var(--outline); }
  .badge .medal img { width: 36px; height: 36px; }
  .badge.locked { opacity: 0.6; }
  .badge.locked .medal { background: var(--sunken); color: var(--muted); }
  .badge b { display: block; font: 600 14px var(--font-display); }
  .badge small { color: var(--muted); }
  /* The nearest goals, above the collection. */
  .goals .section-title { margin-top: 18px; }
  .goal-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .goal { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 12px 14px; }
  .goal img { width: 52px; height: 52px; object-fit: contain; }
  .goal b { display: block; font: 600 15px var(--font-display); }
  .goal .bar { height: 8px; margin: 6px 0 4px; border-width: 1.5px; }
  .goal small { display: block; color: var(--muted); font-size: 12.5px; }
  /* First steps: a short list with a bar, until everything is done. */
  .first-steps { margin-top: 14px; padding: 12px 16px; }
  .steps-head { display: flex; justify-content: space-between; align-items: baseline; }
  .steps-head b { font: 600 15px var(--font-display); }
  .steps-head small { color: var(--muted); }
  .first-steps .bar { height: 8px; margin: 8px 0; border-width: 1.5px; }
  .first-steps ol { margin: 0; padding-left: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 18px; font-size: 13.5px; }
  .first-steps li.ok { color: var(--muted); text-decoration: line-through; }
</style>
</head>
<body class="page" data-page="dex">
<main class="wrap">
  <div class="hero">
    <div><h1>Opendex</h1><p id="intro"></p></div>
    <div class="aside"><div class="big-number" id="seen"></div><div class="muted" id="seen-label"></div><div class="bar progress"><i id="seen-bar"></i></div></div>
  </div>
  <section class="first-steps panel soft" id="first-steps" hidden></section>
  <section class="goals" id="goals" hidden></section>
  <div class="filters" id="filters" role="toolbar"></div>
  <div class="type-info" id="type-info" hidden></div>
  <div class="grid" id="grid"></div>
  <h2 class="section-title"><span id="h-hall">Hall of Fame</span></h2>
  <div class="hof" id="hof"></div>
  <h2 class="section-title"><span id="h-badges">Badges</span> <small id="badge-count"></small></h2>
  <div class="badges" id="badges"></div>
</main>
<dialog id="detail"><div class="detail">
  <div class="stage" id="d-stage"><canvas id="big"></canvas></div>
  <div class="sub" id="d-no"></div>
  <h3 id="d-name"></h3>
  <div class="types-row" id="d-types"></div>
  <div class="sub" id="d-meta"></div>
  <p class="text" id="d-text"></p>
  <div class="how" id="d-how"></div>
  <div class="line" id="d-line"></div>
  <button id="d-close" class="btn"></button>
</div></dialog>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="art.js"></script>
<script src="motion.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const revealAll = params.has('all');
  const cells = [];
  // Which cells are on screen (scrolling brings them back to life).
  const onScreen = new IntersectionObserver((entries) => {
    for (const e of entries) {
      const c = cells.find((x) => x.canvas === e.target);
      if (!c) continue;
      c.visible = e.isIntersecting;
      // Back on screen: a "???" gets one more short round of drawing.
      if (c.visible) delete c.drawnAt;
    }
  }, { rootMargin: '100px' });
  let open = null;
  const { t: tr, lang } = window.OpenmonI18n;
  const WORK = (lineage) => tr(`work.${lineage}`);
  let labels = {};
  const lineageName = (l) => (l === 'chimera' ? 'Chimera' : labels[l] || l);
  document.documentElement.lang = lang;
  for (const [id, key] of [['h-badges', 'dex.badges'], ['h-hall', 'dex.hall'], ['d-close', 'dex.close']]) document.getElementById(id).textContent = tr(key);

  function pad(n) { return `#${String(n).padStart(3, '0')}`; }

  function draw(canvas, spec, t, silhouette) {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    if (!size) return;
    if (canvas.width !== Math.round(size * dpr)) {
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const k = canvas.width / 200;
    ctx.setTransform(k, 0, 0, k, 100 * k, 168 * k);
    const anim = OpenmonMotion.poseAnim({ ...spec, pose: silhouette ? 'sleep' : 'idle', t, since: 0 });
    OpenmonArt.drawCreature(ctx, { ...spec, t, size: 44, pose: 'idle', anim });
    if (silhouette) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-atop';
      // A dark cut-out, the same in light and dark themes.
      ctx.fillStyle = 'rgba(14, 10, 22, 0.82)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // The nearest goals, each with how far along it is: the next form, the
  // closest accessory, the next gift for coming back day after day.
  function renderGoals(pet, species) {
    const box = document.getElementById('goals');
    if (!pet) return;
    const goals = [];
    const pr = pet.progress || {};
    if (pr.next && !pr.needsStarter && pet.lineage) {
      const next = (species.lineages[pet.lineage] || {})[pr.next];
      goals.push({ icon: `/art/${pet.lineage}-${pr.next}.svg`, title: tr('goals.form', { name: next || '???' }), ratio: pr.ratio, sub: pr.needsBond && !pr.xpToGo ? tr('card.needsBond', { n: pr.bondNeeded }) : tr('goals.xp', { n: (pr.xpToGo || 0).toLocaleString(lang) }) });
    }
    const wear = (pet.cosmetics || []).filter((c) => !c.owned && c.progress && c.progress.need > 0).sort((a, b) => b.progress.have / b.progress.need - a.progress.have / a.progress.need)[0];
    if (wear) goals.push({ icon: `/wear/${wear.id}.svg`, title: tr(`wear.${wear.id}`), ratio: wear.progress.have / wear.progress.need, sub: `${tr(`wear.${wear.id}.how`)} · ${wear.progress.have}/${wear.progress.need}` });
    const days = (pet.streak && pet.streak.days) || 0;
    const gifts = [['candy', 7], ['stone-' + (pet.lineage || 'craft'), 3], ['xp-charm', 14], ['mystery-egg', 30]].map(([id, every]) => ({ id, every, left: every - (days % every) }));
    const gift = gifts.sort((a, b) => a.left - b.left)[0];
    goals.push({ icon: `/items/${gift.id}.svg`, title: gift.id.startsWith('stone-') ? tr('item.stone', { type: tr(`power.${gift.id.slice(6)}`) }) : tr(`item.${gift.id}`), ratio: 1 - gift.left / gift.every, sub: gift.left === 1 ? tr('goals.tomorrow') : tr('goals.days', { n: gift.left }) });
    box.textContent = '';
    box.append(Object.assign(document.createElement('h2'), { className: 'section-title', textContent: tr('goals.title') }));
    const row = document.createElement('div');
    row.className = 'goal-row';
    for (const g of goals) {
      const c = document.createElement('div');
      c.className = 'goal panel soft';
      const img = Object.assign(document.createElement('img'), { src: g.icon, alt: '' });
      const text = document.createElement('div');
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('i');
      fill.style.width = `${Math.round(Math.max(0.03, Math.min(1, g.ratio)) * 100)}%`;
      bar.append(fill);
      text.append(Object.assign(document.createElement('b'), { textContent: g.title }), bar, Object.assign(document.createElement('small'), { textContent: g.sub }));
      c.append(img, text);
      row.append(c);
    }
    box.append(row);
    box.hidden = false;
  }

  // First steps, until they are all done: connect an agent, a first session,
  // pick the starter, pet it, a nickname, the first evolution.
  function renderFirstSteps(state, pet) {
    const box = document.getElementById('first-steps');
    if (!pet) return;
    const steps = [
      [tr('steps.connect'), Boolean(state.setup && state.setup.hooks) || (pet.counters && pet.counters.tools > 0)],
      [tr('steps.session'), Boolean(pet.counters && pet.counters.tools > 0)],
      [tr('steps.starter'), pet.stage !== 'egg' || Boolean(pet.starter)],
      [tr('steps.pet'), Boolean(pet.counters && pet.counters.pets > 0)],
      [tr('steps.assistant'), Object.keys(state.chatSessions || {}).length > 0],
      [tr('steps.name'), Boolean(pet.nickname)],
      [tr('steps.evolve'), Boolean(pet.achievements && pet.achievements['first-evolution'])],
    ];
    const done = steps.filter(([, ok]) => ok).length;
    if (done === steps.length) return;
    box.textContent = '';
    const head = document.createElement('div');
    head.className = 'steps-head';
    head.append(Object.assign(document.createElement('b'), { textContent: tr('steps.title') }), Object.assign(document.createElement('small'), { textContent: `${done}/${steps.length}` }));
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('i');
    fill.style.width = `${Math.round((done / steps.length) * 100)}%`;
    bar.append(fill);
    const list = document.createElement('ol');
    for (const [text, ok] of steps) list.append(Object.assign(document.createElement('li'), { className: ok ? 'ok' : '', textContent: text }));
    box.append(head, bar, list);
    box.hidden = false;
  }

  async function main() {
    const [species, state] = await Promise.all([fetch(`/api/species?lang=${lang}`).then((r) => r.json()), fetch('/api/state').then((r) => r.json()).catch(() => null)]);
    const pet = state && !state.demo ? state.pet : null;
    labels = species.statLabels || {};
    renderGoals(pet, species);
    renderFirstSteps(state, pet);
    const dex = (pet && pet.dex) || {};
    const grid = document.getElementById('grid');
    let seen = 0;
    for (const entry of species.dex) {
      // A Juvenile met in the wild counts as seen, even if it got away.
      const metWild = !dex[entry.key] && entry.stage === 'juvenile' && pet && pet.wildSeen && pet.wildSeen[entry.lineage];
      const known = revealAll || Boolean(dex[entry.key]) || Boolean(metWild);
      if (known) seen++;
      // ?shiny previews the shiny colours (dev aid, like ?all).
      // Legendaries draw at Elder size.
      const spec = { stage: entry.legend ? 'mythic' : entry.stage, lineage: entry.lineage, legend: entry.legend || null, trait: null, progress: 0.3, shiny: params.has('shiny') && entry.stage !== 'egg' };
      const current = pet && pet.formKey === entry.key;
      if (current) Object.assign(spec, { trait: pet.trait, shiny: pet.shiny, chimera: pet.chimera });
      const el = document.createElement('button');
      el.className = `cell${known ? '' : ' unseen'}${current ? ' current' : ''}${entry.lineage ? ` t-${entry.lineage}` : ''}`;
      el.dataset.lineage = entry.lineage || (entry.legend ? 'legend' : 'base');
      el.innerHTML = `<div class="stage"><span class="no">${pad(entry.no)}</span>${current ? `<span class="you">${tr('dex.you')}</span>` : ''}<canvas></canvas></div><div class="name"></div><div class="sub"></div>`;
      el.querySelector('.name').textContent = known ? OpenmonI18n.name(entry.name) : '???';
      const sub = metWild && !revealAll ? tr('dex.wildSeen') : known ? (entry.lineage ? `${lineageName(entry.lineage)} · ${tr(`stage.${entry.stage}`)}` : tr(`stage.${entry.stage}`)) : entry.hidden ? tr('dex.hiddenForm') : entry.lineage ? tr('dex.growsFrom', { work: WORK(entry.lineage) }) : '';
      // The egg's stage is its name too: say what it is instead.
      el.querySelector('.sub').textContent = known && sub.toLowerCase() === OpenmonI18n.name(entry.name).toLowerCase() ? tr('dex.firstForm') : sub;
      el.addEventListener('click', () => show(entry, spec, known));
      grid.appendChild(el);
      const cell = { canvas: el.querySelector('canvas'), spec, known, offset: entry.no * 0.7, visible: false };
      cells.push(cell);
      onScreen.observe(cell.canvas);
      // Drawn once at once; then only the cells on screen move.
      draw(cell.canvas, spec, cell.offset, !known);
    }
    renderTypes(species, dex);
    document.getElementById('seen').textContent = `${seen}/${species.dex.length}`;
    document.getElementById('seen-label').textContent = tr('dex.seenShort');
    document.getElementById('seen-bar').style.width = `${Math.round((seen / species.dex.length) * 100)}%`;
    document.getElementById('intro').textContent = tr('dex.intro');

    const earned = (pet && pet.achievements) || {};
    const badges = document.getElementById('badges');
    let got = 0;
    for (const [id, a] of Object.entries(species.achievements)) {
      const have = Boolean(earned[id]);
      if (have) got++;
      const d = document.createElement('div');
      d.className = `badge${have ? '' : ' locked'}`;
      const medal = document.createElement('span');
      medal.className = 'medal';
      medal.textContent = have ? '★' : '?';
      // The designer's badge (public/badges/<id>.svg, or locked.svg) replaces the glyph.
      const file = `${have ? id : 'locked'}.svg`;
      window.OpenmonSlots.then((slots) => {
        if (!slots.has(`badges/${file}`)) return;
        const art = new Image();
        art.alt = '';
        art.onload = () => medal.replaceChildren(art);
        art.src = `/badges/${encodeURIComponent(file)}`;
      });
      const text = document.createElement('div');
      const title = document.createElement('b');
      title.textContent = !have && a.secret ? '???' : a.title;
      const sub = document.createElement('small');
      sub.textContent = have ? `${a.text} ${new Date(earned[id]).toLocaleDateString()}` : a.secret ? tr('dex.secret') : a.text;
      text.append(title, sub);
      d.append(medal, text);
      badges.appendChild(d);
    }
    document.getElementById('badge-count').textContent = `${got}/${Object.keys(species.achievements).length}`;

    const hof = document.getElementById('hof');
    const fame = (pet && pet.hallOfFame) || [];
    if (!fame.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = tr('dex.hallEmpty');
      hof.appendChild(p);
    }
    for (const f of fame) {
      const d = document.createElement('div');
      d.textContent = tr('dex.hallEntry', { gen: f.generation, name: f.name, form: f.form }) + (f.shiny ? ' ★' : '');
      hof.appendChild(d);
    }
    OpenmonMotion.loop(frame, { fps: 24 });
  }

  // Types, as a chart: what work trains each one, how much
  // it counts, its evolution line and the power it unlocks.
  const TYPES = ['craft', 'lore', 'shell', 'test', 'roam', 'swarm', 'docs', 'git', 'debug', 'data', 'style'];
  let lineages = {};
  let weights = {};
  let dexSeen = {};
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const typeChip = (t) => {
    const c = el('span', 'type-chip', t ? lineageName(t) : tr('type.base'));
    c.style.setProperty('--c', t ? (t === 'chimera' ? 'linear-gradient(90deg, var(--craft), var(--swarm))' : `var(--${t})`) : 'var(--sunken)');
    if (t === 'chimera') c.style.background = 'linear-gradient(90deg, var(--craft), var(--lore), var(--roam))';
    return c;
  };
  function evolutionLine(t, current) {
    const box = el('div', 'line');
    if (t === 'chimera') return box;
    box.append(el('b', '', tr('type.line') + ':'), ' ');
    ['juvenile', 'adult', 'mythic'].forEach((stage, i) => {
      if (i) box.append(el('i', '', '→'));
      const known = revealAll || dexSeen[`${t}-${stage}`];
      box.append(el('span', current === `${t}-${stage}` ? 'cur' : '', known ? lineages[t][stage] : '???'));
    });
    return box;
  }
  function renderTypes(species, dex) {
    lineages = species.lineages;
    weights = species.weights || {};
    dexSeen = dex;
    const bar = document.getElementById('filters');
    bar.setAttribute('aria-label', tr('types.title'));
    const pick = (t) => {
      for (const b of bar.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.type === (t || '')));
      for (const c of document.querySelectorAll('#grid .cell')) c.hidden = Boolean(t) && c.dataset.lineage !== t;
      renderTypeInfo(t);
    };
    const all = el('button', 'all', tr('types.all'));
    all.type = 'button';
    all.dataset.type = '';
    all.onclick = () => pick(null);
    bar.append(all);
    for (const t of [...TYPES, 'chimera']) {
      const b = el('button', `t-${t}`);
      b.type = 'button';
      b.dataset.type = t;
      const img = el('img');
      img.src = `/art/${t === 'chimera' ? 'chimera-adult' : `${t}-juvenile`}.svg`;
      img.alt = '';
      if (!(revealAll || dex[t === 'chimera' ? 'chimera-adult' : `${t}-juvenile`])) img.style.filter = 'grayscale(1) brightness(0.3)';
      b.append(img, t === 'chimera' ? tr('types.hidden') : lineageName(t));
      b.onclick = () => pick(b.getAttribute('aria-pressed') === 'true' ? null : t);
      bar.append(b);
    }
    pick(null);
  }
  // The picked type explains itself: what trains it, how much it counts,
  // the power it unlocks and its line.
  function renderTypeInfo(t) {
    const box = document.getElementById('type-info');
    box.textContent = '';
    box.hidden = !t;
    if (!t) return;
    box.className = `type-info t-${t}`;
    const key = t === 'chimera' ? 'chimera-adult' : `${t}-juvenile`;
    const img = el('img', revealAll || dexSeen[key] ? '' : 'unseen');
    img.src = `/art/${key}.svg`;
    img.alt = '';
    if (t === 'chimera') {
      box.append(img, el('p', '', tr('types.hiddenText')));
      return;
    }
    const meta = el('div', 'meta');
    const tag = el('span', 'type-tag', lineageName(t));
    const w = el('span', 'chip', tr('type.weight', { w: weights[t] || 1 }));
    w.title = tr('type.weightWhy');
    meta.append(tag, w, el('span', 'chip brand', tr('type.power', { power: tr(`power.${t}.title`) })));
    box.append(img, meta, el('p', '', tr(`type.${t}.how`)), evolutionLine(t, null));
  }

  function show(entry, spec, known) {
    open = { spec, known };
    document.getElementById('d-stage').className = `stage${entry.lineage && known ? ` t-${entry.lineage}` : ''}`;
    const types = document.getElementById('d-types');
    types.textContent = '';
    types.append(entry.lineage && entry.lineage !== 'chimera' ? el('span', `type-tag t-${entry.lineage}`, lineageName(entry.lineage)) : typeChip(entry.lineage));
    const how = document.getElementById('d-how');
    how.textContent = '';
    if (entry.hidden && !known) how.hidden = true;
    else {
      how.hidden = false;
      if (entry.legend) how.append(el('b', '', tr('dex.legendary') + ': '), tr(`legend.${entry.legend}.how`));
      else if (!entry.lineage) how.append(tr('type.baseHow'));
      else if (entry.lineage === 'chimera') how.append(tr('types.hiddenText'));
      else how.append(el('b', '', lineageName(entry.lineage) + ': '), tr(`type.${entry.lineage}.how`), ' ', tr('type.weight', { w: weights[entry.lineage] || 1 }) + '.');
    }
    const lineBox = document.getElementById('d-line');
    lineBox.replaceWith(Object.assign(entry.lineage ? evolutionLine(entry.lineage, entry.key) : el('div', 'line'), { id: 'd-line' }));
    document.getElementById('d-no').textContent = pad(entry.no);
    document.getElementById('d-name').textContent = known ? OpenmonI18n.name(entry.name) : '???';
    document.getElementById('d-meta').textContent = entry.lineage ? tr('dex.lineage', { lineage: lineageName(entry.lineage), stage: tr(`stage.${entry.stage}`) }) : tr(`stage.${entry.stage}`);
    document.getElementById('d-text').textContent = known ? entry.text : entry.hidden ? tr('dex.hiddenText') : entry.lineage ? tr('dex.unseenText', { work: WORK(entry.lineage) }) : tr('dex.unseen');
    document.getElementById('detail').showModal();
  }
  document.getElementById('d-close').addEventListener('click', () => document.getElementById('detail').close());
  document.getElementById('detail').addEventListener('close', () => (open = null));

  // Only what is on screen is drawn, and the "???" ones stand still: after
  // a few seconds (art loaded) they are not drawn again. A full Opendex
  // drawing all 39 every frame took most of a CPU core.
  const STILL_AFTER = 4;
  function frame(ms) {
    const t = ms / 1000;
    for (const c of cells) {
      if (!c.visible) continue;
      if (!c.known && c.drawnAt !== undefined && t - c.drawnAt > STILL_AFTER) continue;
      if (!c.known && c.drawnAt === undefined) c.drawnAt = t;
      draw(c.canvas, c.spec, t + c.offset, !c.known);
    }
    if (open) draw(document.getElementById('big'), open.spec, t, !open.known);
  }
  OpenmonArt.loadPack().then(main);
</script>
</body>
</html>
