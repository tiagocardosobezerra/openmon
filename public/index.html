<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage">
    <div id="card" hidden>
      <header class="card-head">
        <div class="card-id">
          <div class="card-title"><span id="card-name"></span><span id="card-level" class="lv"></span></div>
          <div class="card-form"><span id="card-form"></span><span id="card-stage" class="chip brand"></span></div>
        </div>
        <button id="card-settings" class="icon-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button id="card-close" class="icon-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div id="card-sub" class="card-chips"></div>
      <div class="meters">
        <div class="meter"><span>XP</span><div class="bar"><i id="xp-bar"></i></div><b id="xp-text"></b></div>
        <div class="meter"><span id="lbl-bond">Bond</span><div class="bar bond"><i id="bond-bar"></i></div><b id="bond-text"></b></div>
      </div>
      <div class="seg" role="tablist" id="card-tabs">
        <button role="tab" data-tab="agents" id="tab-agents"></button>
        <button role="tab" data-tab="today" id="tab-today"></button>
        <button role="tab" data-tab="stats" id="tab-stats"></button>
      </div>
      <section class="tab-body" data-tab="agents">
        <ul id="sessions"></ul>
      </section>
      <section class="tab-body" data-tab="today" hidden>
        <div id="card-wait" class="card-wait"></div>
        <ul id="missions" class="missions"></ul>
      </section>
      <section class="tab-body" data-tab="stats" hidden>
        <p id="stat-info" class="stat-info"></p>
        <div id="stats" class="stats"></div>
      </section>
      <footer class="card-actions">
        <button id="card-powers" class="btn primary sm" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span id="lbl-powers"></span></button>
        <button id="card-dex" class="btn sm" type="button"><span>Opendex</span></button>
        <button id="card-bag" class="btn sm" type="button"><span id="lbl-bag"></span></button>
      </footer>
    </div>
    <div id="bubble" hidden></div>
    <div id="badge" hidden></div>
    <canvas id="pet" aria-label="Your Openmon"></canvas>
  </div>
  <div id="controls" hidden>
    <button data-act="demo">Play demo</button>
    <button data-act="stop">Stop demo</button>
    <button data-act="pet">Pet</button>
    <button data-act="mute">Mute</button>
    <select id="force" aria-label="Preview a form">
      <option value="">Live pet</option>
    </select>
  </div>
  <script src="i18n.js"></script>
  <script src="art.js"></script>
  <script src="motion.js"></script>
  <script src="app.js"></script>
</body>
</html>
