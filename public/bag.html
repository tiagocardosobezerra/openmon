<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon Bag</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding-bottom: 48px; }
  .item.none .icon, .item.none h3 { opacity: 0.5; }
  .item.none .icon img { filter: grayscale(0.6); }
  .none-note { font-size: 12.5px; color: var(--muted); font-style: italic; }
  /* Items as tiles: the icon first and big, the count, one button; what it
     does only when asked ("?"). */
  .items, .stones { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-items: start; }
  .item { position: relative; display: grid; justify-items: center; align-content: start; gap: 4px; padding: 12px 10px 12px; text-align: center; }
  .item .icon { width: 84px; height: 84px; border-radius: 20px; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, var(--surface), var(--surface-2) 75%); box-shadow: inset 0 0 0 2px var(--line); }
  .item .icon svg, .item .icon img { width: 68px; height: 68px; }
  .item.empty { opacity: 0.55; }
  .item h3 { margin: 4px 0 0; font-size: 15px; line-height: 1.2; }
  .item .count { font: 600 13px var(--font-display); color: var(--muted); }
  .item .count.have { color: var(--ink); background: var(--sun); color: #2a2140; padding: 0 8px; border-radius: 99px; box-shadow: 0 0 0 1.5px var(--outline); }
  .item .desc { display: none; margin: 4px 0 0; font-size: 12.5px; color: var(--muted); text-align: left; }
  .item.open .desc { display: block; }
  .item .why { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); font: 700 13px/1 var(--font-display); cursor: pointer; }
  .item .why[aria-expanded="true"] { background: var(--brand-soft); color: var(--brand-ink); }
  .item p:not(.desc) { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .item select { max-width: 100%; }
  .item .btn { margin-top: 6px; }
  .item.holding { box-shadow: var(--lift), 0 0 0 3px color-mix(in srgb, var(--brand) 40%, transparent); }
  .wear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  /* An accessory: your Openmon wearing it on its stage (edge to edge, one
     frame), the name, and what a click does. */
  .wear { position: relative; display: grid; gap: 2px; justify-items: center; align-content: start; padding: 0 0 12px; text-align: center; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r-lg); font: inherit; color: inherit; cursor: pointer; overflow: hidden; transition: transform 0.08s ease, box-shadow 0.08s ease; }
  .wear:hover:not(.locked) { transform: translateY(-2px); border-color: var(--outline); box-shadow: var(--lift); }
  .wear.worn { border-color: var(--outline); box-shadow: var(--lift), 0 0 0 3px var(--sun); }
  .wear.locked { cursor: default; }
  .wear .stage { width: 100%; height: 132px; margin-bottom: 8px; border-radius: 0; box-shadow: inset 0 calc(-1 * var(--bw)) 0 color-mix(in srgb, var(--type, var(--outline)) 40%, var(--line)); }
  .wear.locked .stage { background: var(--sunken); }
  .wear.locked canvas { filter: brightness(0) opacity(0.55); }
  .wear canvas { width: 128px; height: 128px; }
  .wear b { font: 600 14.5px/1.2 var(--font-display); padding: 0 8px; }
  .wear small { font-size: 12px; color: var(--muted); padding: 0 8px; }
  .wear .state { margin-top: 6px; padding: 3px 12px; border-radius: 99px; font: 600 12px var(--font-display); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
  .wear.worn .state { color: #2a2140; background: var(--sun); box-shadow: inset 0 0 0 1.5px var(--outline); }
  .wear:hover:not(.locked):not(.worn) .state { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--outline); }
  .wear .bar { width: calc(100% - 32px); height: 6px; margin-top: 6px; border-width: 1.5px; }
  .slot-title { margin: 22px 0 10px; }
  .empty-egg { padding: 18px; }
</style>
</head>
<body class="page" data-page="bag">
<main class="wrap">
  <div class="hero"><div><h1 id="title"></h1><p id="sub"></p></div></div>
  <h2 class="section-title" id="h-items"></h2>
  <div class="items" id="items"></div>
  <h2 class="section-title" id="h-field"></h2>
  <div class="items" id="field"></div>
  <h2 class="section-title" id="h-stones"></h2>
  <div class="stones" id="stones"></div>
  <h2 class="section-title"><span id="h-wear"></span> <small id="wear-count"></small></h2>
  <p class="muted" id="wear-sub" style="margin:-4px 0 0"></p>
  <h3 class="slot-title display" id="h-head"></h3>
  <div class="wear-grid" id="head"></div>
  <h3 class="slot-title display" id="h-face"></h3>
  <div class="wear-grid" id="face"></div>
  <h3 class="slot-title display" id="h-neck"></h3>
  <div class="wear-grid" id="neck"></div>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="art.js"></script>
<script src="motion.js"></script>
<script>
  const { t: tr, lang } = window.OpenmonI18n;
  document.documentElement.lang = lang;
  const $ = (id) => document.getElementById(id);
  for (const [id, key] of [['title', 'bag.title'], ['sub', 'bag.sub'], ['h-items', 'bag.toUse'], ['h-wear', 'bag.wear'], ['wear-sub', 'bag.wearSub'], ['h-head', 'bag.head'], ['h-face', 'bag.face'], ['h-neck', 'bag.neck'], ['h-stones', 'bag.toHold'], ['h-field', 'bag.field']]) $(id).textContent = tr(key);

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  // Item icons, drawn as small SVGs in the creatures' ink style.
  const ICONS = {
    snack: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#e3a35a" stroke="#2a2140" stroke-width="3"/><circle cx="15" cy="16" r="2.4" fill="#6b3f1d"/><circle cx="24" cy="14" r="2" fill="#6b3f1d"/><circle cx="23" cy="24" r="2.4" fill="#6b3f1d"/><circle cx="14" cy="25" r="1.8" fill="#6b3f1d"/></svg>',
    candy: '<svg viewBox="0 0 40 40"><path d="M6 14 L12 20 L6 26 Z M34 14 L28 20 L34 26 Z" fill="#ff7fa3" stroke="#2a2140" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="20" cy="20" rx="10" ry="9" fill="#7c6cf2" stroke="#2a2140" stroke-width="3"/><path d="M14 17 Q20 12 26 17" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
    everstone: '<svg viewBox="0 0 40 40"><path d="M9 26 Q7 14 18 9 Q31 7 33 19 Q35 31 21 32 Q11 33 9 26Z" fill="#b9b2c8" stroke="#2a2140" stroke-width="3"/><path d="M14 18 Q19 14 25 16" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><circle cx="24" cy="25" r="2" fill="#8e86a3"/></svg>',
  };

  let pet = null;
  let cfg = {};
  // How many of each item other team members hold: those are not free.
  let held = {};
  const previews = [];

  async function act(path, body) {
    await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    await load();
  }

  // Held items: the Steady stone and the type stones (one held at a time).
  const HELD = (id) => id === 'everstone' || id.startsWith('stone-');
  const THROW = (id) => id === 'openball' || id === 'openball-plus' || id === 'openball-master';
  // Field items work for the next wild encounters, whatever the pet is.
  const FIELD = (id) => id === 'lure' || id === 'lantern' || id === 'field-map';
  const TYPES = ['craft', 'lore', 'shell', 'test', 'roam', 'swarm', 'docs', 'git', 'debug', 'data', 'style'];

  function itemCard(id, small) {
    const holding = pet.holding === id;
    const n = Math.max(0, (pet.bag[id] || 0) - (held[id] || 0) - (holding ? 1 : 0));
    const card = el('div', `item panel${holding ? ' holding' : ''}${!n && !holding && small ? ' empty' : ''}`);
    const icon = el('div', 'icon');
    // The designer's file wins; the three drawn here fill in until it exists.
    const img = Object.assign(el('img'), { alt: '' });
    if (ICONS[id]) img.onerror = () => (icon.innerHTML = ICONS[id]);
    img.src = `/items/${id}.svg`;
    icon.append(img);
    const stone = id.startsWith('stone-') ? id.slice(6) : null;
    const h = el('h3', '', stone ? tr('item.stone', { type: tr(`power.${stone}`) }) : tr(`item.${id}`));
    card.append(icon, h, el('span', `count${n ? ' have' : ''}`, holding ? tr('bag.holding') : `×${n}`));
    let text = stone ? tr('bag.stonesSub') : tr(`item.${id}.text`);
    if (id === 'xp-charm' && pet.charmUntil) text = tr('item.xp-charm.on', { t: new Date(pet.charmUntil).toLocaleString(lang, { weekday: 'short', hour: '2-digit', minute: '2-digit' }) });
    const why = el('button', 'why', '?');
    why.type = 'button';
    why.setAttribute('aria-label', tr('bag.what'));
    why.setAttribute('aria-expanded', 'false');
    why.onclick = () => why.setAttribute('aria-expanded', String(card.classList.toggle('open')));
    card.append(why, el('p', 'desc', text));
    let btn;
    // Openballs are thrown from the pet's bubble when a wild one shows up.
    if (THROW(id)) {
      if (!n) {
        card.classList.add('none');
        // "×0" already says it: no line of text repeated on every empty tile.
      }
      return card;
    }
    if (HELD(id)) {
      btn = el('button', `btn sm${holding ? ' brand' : ''}`, holding ? tr('bag.letGo') : tr('bag.hold'));
      // Legendaries and Elders never evolve again, so they hold nothing.
      const final = pet.legend || pet.stage === 'mythic';
      btn.disabled = !holding && (!n || final);
      if (!holding && final) btn.title = tr('bag.noEvolve');
      else if (!holding && !n && held[id]) btn.title = tr('bag.heldElsewhere');
    } else if (FIELD(id)) {
      btn = el('button', 'btn sm primary', tr('bag.use'));
      const lit = id === 'lantern' && pet.lantern;
      const lured = id === 'lure' && pet.lureUntil;
      btn.disabled = !n || lit;
      if (lit) btn.title = tr('bag.lanternOn');
      if (lured) card.append(el('p', 'muted', tr('bag.lureOn', { t: new Date(pet.lureUntil).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' }) })));
      if (id === 'field-map' && pet.fieldMap) card.append(el('p', 'muted', tr('bag.mapOn', { type: tr(`power.${pet.fieldMap}`) })));
      if (id === 'field-map' && n) {
        // The map asks which type the next wild one is.
        const pickType = el('select');
        pickType.setAttribute('aria-label', tr('bag.mapPick'));
        for (const t of TYPES) pickType.append(Object.assign(el('option', '', tr(`power.${t}`)), { value: t }));
        card.append(pickType);
        btn.onclick = () => act('/api/use', { item: id, lineage: pickType.value });
      }
    } else {
      btn = el('button', 'btn sm primary', tr(id === 'mystery-egg' ? 'bag.hatch' : 'bag.use'));
      const eggNo = pet.stage === 'egg' && id !== 'mystery-egg';
      const full = (id === 'snack' || id === 'friend-candy') && pet.bond >= 100;
      const top = id === 'candy' && pet.level >= 100;
      btn.disabled = !n || eggNo || full || top || (pet.legend && id !== 'mystery-egg');
      if (eggNo) btn.title = tr('bag.eggNo');
      else if (full) btn.title = tr('bag.fullBond');
      else if (top) btn.title = tr('bag.maxLevel');
    }
    if (!btn.onclick) btn.onclick = () => act('/api/use', { item: id });
    // None left: say so plainly instead of a button that looks pressable.
    if (!n && !holding && !(HELD(id) && held[id])) {
      card.classList.add('none');
      // "×0" already says it: no line of text repeated on every empty tile.
      return card;
    }
    card.append(btn);
    return card;
  }

  function renderItems() {
    const box = $('items');
    box.textContent = '';
    for (const id of ['snack', 'candy', 'friend-candy', 'xp-charm', 'mystery-egg']) box.append(itemCard(id, false));
    const field = $('field');
    field.textContent = '';
    for (const id of ['openball', 'openball-plus', 'openball-master', 'lure', 'lantern', 'field-map']) field.append(itemCard(id, false));
    const stones = $('stones');
    stones.textContent = '';
    stones.append(itemCard('everstone', false));
    for (const t of TYPES) stones.append(itemCard(`stone-${t}`, true));
  }

  function specFor(wear) {
    // An egg with a chosen starter shows what will hatch; any other egg, the egg.
    const hatchling = pet.stage === 'egg' && pet.starter;
    return { stage: hatchling ? 'juvenile' : pet.stage, lineage: hatchling ? pet.starter : pet.lineage, trait: pet.trait, chimera: pet.chimera, shiny: pet.shiny, legend: pet.legend, wear };
  }

  function drawPreview(canvas, spec) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = 128 * dpr;
    canvas.height = 128 * dpr;
    const ctx = canvas.getContext('2d');
    const k = canvas.width / 200;
    ctx.setTransform(k, 0, 0, k, 100 * k, 178 * k);
    OpenmonArt.drawCreature(ctx, { ...spec, t: 1, size: 58, pose: 'idle', anim: { eyes: 'happy', mouth: 'grin' } });
  }

  function renderWear() {
    previews.length = 0;
    const list = pet.cosmetics || [];
    $('wear-count').textContent = `${list.filter((c) => c.owned).length}/${list.length}`;
    for (const slot of ['head', 'face', 'neck']) {
      const box = $(slot);
      box.textContent = '';
      for (const c of list.filter((x) => x.slot === slot)) {
        const type = pet.legend ? null : pet.lineage || pet.starter;
        const tile = el('button', `wear${c.owned ? '' : ' locked'}${c.worn ? ' worn' : ''}${type ? ` t-${type}` : ''}`);
        tile.type = 'button';
        const stage = el('div', 'stage');
        const canvas = el('canvas');
        stage.append(canvas);
        tile.append(stage, el('b', '', c.owned ? tr(`wear.${c.id}`) : '???'));
        if (c.owned) tile.append(el('span', 'state', c.worn ? tr('bag.wearing') : tr('bag.tapToWear')));
        else tile.append(el('small', '', tr(`wear.${c.id}.how`)));
        if (c.worn) tile.title = tr('bag.takeOff');
        if (!c.owned && c.progress) {
          const bar = el('div', 'bar');
          const fill = el('i');
          fill.style.width = `${Math.round((c.progress.have / c.progress.need) * 100)}%`;
          bar.append(fill);
          tile.append(bar, el('small', '', `${c.progress.have}/${c.progress.need}`));
        }
        if (c.owned) tile.onclick = () => act('/api/wear', { slot, id: c.worn ? null : c.id });
        const wear = { ...pet.wear, [slot]: c.id };
        previews.push([canvas, specFor(wear)]);
        box.append(tile);
      }
    }
    drawAll();
  }

  function drawAll() {
    for (const [canvas, spec] of previews) drawPreview(canvas, spec);
  }

  async function load() {
    const s = await (await fetch('/api/state')).json();
    pet = s.pet;
    cfg = s.config || {};
    held = (s.party && s.party.held) || {};
    renderItems();
    renderWear();
  }

  // Art, eyes and hat anchors finish loading in the background: draw again
  // a few times until they have.
  OpenmonArt.loadPack().then(load).then(() => {
    let n = 0;
    const again = setInterval(() => (drawAll(), ++n >= 16 && clearInterval(again)), 250);
  });
</script>
</body>
</html>
