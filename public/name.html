<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Name your Openmon</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height: 100%; }
  body.page { min-height: 0; background: var(--surface); }
  form { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 16px 18px; border: 2.5px solid var(--outline); border-radius: 0; }
  label { font: 600 17px var(--font-display); }
  p { margin: -4px 0 4px; color: var(--muted); font-size: 12.5px; }
  .row { display: flex; gap: 8px; }
  .row .input { flex: 1; min-width: 0; }
</style>
</head>
<body class="page">
<form id="f">
  <label for="name">What will you call it?</label>
  <p id="hint">Up to 24 characters. You can change it later.</p>
  <div class="row">
    <input id="name" class="input" maxlength="24" autocomplete="off" spellcheck="false">
    <button type="submit" class="btn primary">OK</button>
  </div>
</form>
<script src="i18n.js"></script>
<script>
  const { t: tr } = window.OpenmonI18n;
  document.querySelector('label').textContent = tr('name.q');
  document.getElementById('hint').textContent = tr('name.hint');
  const input = document.getElementById('name');
  fetch('/api/state').then((r) => r.json()).then((s) => {
    input.value = s.pet.nickname || '';
    input.placeholder = s.pet.form;
    input.select();
    if (s.pet.form) document.getElementById('hint').textContent = tr('name.hintForm', { form: s.pet.form });
  });
  input.focus();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    await fetch('/api/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: input.value }) });
    window.close();
  });
  document.addEventListener('keydown', (e) => e.key === 'Escape' && window.close());
</script>
</body>
</html>
