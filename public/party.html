<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon Party</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding-bottom: 56px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .mon { position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 6px 12px; text-align: center; border-color: color-mix(in srgb, var(--type) 45%, var(--outline)); }
  .mon.active { box-shadow: var(--lift), var(--gloss), 0 0 0 3px color-mix(in srgb, var(--sun) 70%, transparent); }
  .mon .stage { width: 100%; height: 170px; margin-bottom: 6px; }
  .mon canvas { width: 160px; height: 160px; }
  .mon .name { font: 600 18px var(--font-display); }
  .mon .meta { font-size: 12.5px; color: var(--muted); }
  .mon .tag { position: absolute; top: 12px; left: 12px; z-index: 1; }
  .mon .proj { margin-top: 4px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
  .mon .main-act { margin-top: 10px; min-width: 60%; }
  .mon .bar { width: 70%; height: 8px; margin-top: 6px; border-width: 1.5px; }
  /* Everything else about a member: a small menu behind "⋯". */
  .more { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .more > summary { list-style: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink); font: 700 18px/1 var(--font-display); cursor: pointer; }
  .more > summary::-webkit-details-marker { display: none; }
  .more[open] > summary { background: var(--surface); box-shadow: inset 0 0 0 2px var(--outline); }
  .more .menu { position: absolute; right: 0; top: 36px; display: grid; gap: 6px; width: 220px; padding: 10px; text-align: left; background: var(--surface); border: var(--bw) solid var(--outline); border-radius: var(--r-md); box-shadow: var(--lift), 0 10px 24px rgba(20, 12, 40, 0.25); }
  .more .menu .btn { justify-content: flex-start; width: 100%; }
  .more .follow { justify-content: space-between; }
  .empty-slot { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 250px; border: 2px dashed var(--line); border-radius: var(--r-lg); color: var(--muted); text-align: center; padding: 16px; font-size: 13px; }
  .empty-slot img { width: 104px; height: 104px; opacity: 0.9; }
  .follow { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); width: 100%; justify-content: center; }
  .follow select { font: inherit; color: var(--text); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 2px 6px; max-width: 150px; }
  .section-title img { width: 30px; height: 30px; vertical-align: -7px; margin-right: 6px; }
  /* The Nest: a wallpaper behind the stored mons, picked by the trainer. */
  /* The Nest is a scene: the resting Openmon stand on the chosen wallpaper. */
  .boxwrap { min-height: 260px; border-radius: var(--r-lg); padding: 18px; background: center / cover no-repeat var(--sunken); border: var(--bw) solid var(--outline); box-shadow: var(--lift); }
  .boxwrap .muted { background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 8px 12px; border-radius: var(--r-md); display: inline-block; }
  /* In the Nest they stand right in the scene: no card, just a name plate. */
  .boxwrap .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-items: end; }
  .boxwrap .mon { background: none; border: 0; box-shadow: none; padding: 0 0 6px; }
  .boxwrap .stage { background: none; box-shadow: none; height: 150px; }
  .boxwrap .meta, .boxwrap .proj, .boxwrap .bar { display: none; }
  .boxwrap .name { padding: 1px 12px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 88%, transparent); box-shadow: 0 0 0 1.5px var(--outline); font-size: 15px; }
  .boxwrap .main-act { margin-top: 6px; min-width: 0; }
  .boxwrap .more { top: 0; }
  .walls { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: 10px; vertical-align: middle; }
  .walls button { width: 34px; height: 22px; padding: 0; border-radius: 7px; border: 2px solid var(--line); background: center / cover no-repeat; cursor: pointer; }
  .walls button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--sun); }
  .upcoming { display: grid; gap: 6px; max-width: 640px; }
  .upcoming div { display: grid; grid-template-columns: 1fr 160px auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: var(--r-md); background: var(--surface); border: var(--bw) solid var(--line); }
  .switch { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .switch input { width: 18px; height: 18px; accent-color: var(--brand); }
</style>
</head>
<body class="page" data-page="party">
<main class="wrap">
  <div class="hero"><div><h1 id="title"></h1><p id="sub"></p></div></div>
  <h2 class="section-title"><img src="/ui/party.svg" alt=""><span id="h-party"></span> <small id="party-count"></small></h2>
  <div class="grid" id="party"></div>
  <h2 class="section-title" id="h-upcoming"></h2>
  <p class="muted" id="upcoming-sub" style="margin:-4px 0 10px"></p>
  <div class="upcoming" id="upcoming"></div>
  <h2 class="section-title"><img src="/ui/nest.svg" alt=""><span id="h-box"></span> <small id="box-count"></small><span class="walls" id="walls"></span></h2>
  <div class="boxwrap" id="boxwrap"><div class="grid" id="box"></div></div>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="art.js"></script>
<script src="motion.js"></script>
<script>
  const { t: tr, lang } = window.OpenmonI18n;
  document.documentElement.lang = lang;
  const $ = (id) => document.getElementById(id);
  for (const [id, key] of [['title', 'party.title'], ['sub', 'party.sub'], ['h-party', 'party.party'], ['h-box', 'party.box'], ['h-upcoming', 'party.upcoming'], ['upcoming-sub', 'party.upcomingSub']]) $(id).textContent = tr(key);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const canvases = [];
  let data = null;
  let cfg = {};

  async function post(path, body) {
    await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    await load();
  }

  function card(p, size) {
    const type = p.legend ? null : p.lineage || null;
    const c = el('div', `mon panel${p.active ? ' active' : ''}${type ? ` t-${type}` : ''}`);
    const stage = el('div', 'stage');
    const canvas = el('canvas');
    stage.append(canvas);
    canvases.push([canvas, p]);
    c.append(stage, el('span', 'name', p.shiny && p.stage !== 'egg' ? `${p.name} ★` : p.name), el('span', 'meta', `${tr('card.level', { n: p.level })} · ${p.form}`));
    // Legendaries, mystery eggs and wild ones belong to no project.
    const special = p.legend ? tr('party.legendTag') : p.project && p.project.startsWith('mystery:') ? tr('party.mysteryTag') : p.project && p.project.startsWith('wild:') ? tr('party.wildTag') : null;
    const mystery = !p.legend && p.project && p.project.startsWith('mystery:');
    const proj = el('span', 'chip proj', special || p.project || tr('party.general'));
    proj.title = mystery ? tr('party.mysteryHow') : special || (p.project ? tr('party.project', { project: p.project }) : tr('party.general'));
    c.append(proj);
    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = `${Math.round((p.progress || 0) * 100)}%`;
    bar.append(fill);
    c.append(bar);
    if (p.active || (cfg.companions || []).includes(p.id)) c.append(el('span', 'tag chip sun', tr('party.onScreen')));

    // The one main action: bring it to the screen (or back from the Nest).
    if (!p.active) {
      const inNest = p.place === 'box';
      const main = el('button', 'btn primary main-act', inNest ? tr('party.toParty') : tr('party.show'));
      main.onclick = () => (inNest ? post('/api/party/move', { id: p.id, place: 'party' }) : post('/api/party/active', { id: p.id }));
      if (inNest && data.members.length >= size) {
        main.disabled = true;
        main.title = tr('party.full');
      }
      c.append(main);
    }

    // Everything else, behind "⋯".
    const more = el('details', 'more');
    const sum = el('summary', '', '⋯');
    sum.setAttribute('aria-label', tr('party.moreActions'));
    sum.title = tr('party.moreActions');
    const menu = el('div', 'menu');
    // Which project this pet follows: automatic, or a project pinned to it.
    if (p.place === 'party' && !p.legend) {
      const row = el('label', 'follow');
      row.append(el('span', '', tr('party.follows')));
      const sel = el('select');
      const projects = [...new Set([...data.members, ...data.box].map((m) => m.project).concat(data.upcoming.map((u) => u.project)).filter((x) => x && !x.startsWith('mystery:') && !x.startsWith('wild:') && !x.startsWith('legend:')))].sort();
      const current = (cfg.follows || {})[p.id] || '';
      for (const [value, text] of [['', tr('party.followsAuto')], ...projects.map((x) => [x, x])]) {
        const o = el('option', '', text);
        o.value = value;
        o.selected = value === current;
        sel.append(o);
      }
      sel.title = tr('party.followsHelp');
      sel.onchange = () => post('/api/follow', { pet: p.id, project: sel.value || null });
      row.append(sel);
      menu.append(row);
    }
    if (!p.active && p.place === 'party') {
      // Also on screen, next to the main one (up to 2 more).
      const list = cfg.companions || [];
      const on = list.includes(p.id);
      const also = el('button', 'btn sm quiet', tr(on ? 'party.alsoOff' : 'party.alsoOn'));
      if (!on && list.length >= 2) {
        also.disabled = true;
        also.title = tr('party.alsoFull');
      }
      also.onclick = () => post('/api/config', { companions: on ? list.filter((x) => x !== p.id) : [...list, p.id] });
      menu.append(also);
      const toNest = el('button', 'btn sm quiet', tr('party.toBox'));
      toNest.onclick = () => post('/api/party/move', { id: p.id, place: 'box' });
      menu.append(toNest);
    }
    if (!p.active && p.place === 'box') {
      const show = el('button', 'btn sm quiet', tr('party.show'));
      show.onclick = () => post('/api/party/active', { id: p.id });
      menu.append(show);
    }
    const rename = el('button', 'btn sm quiet', tr('party.rename'));
    rename.onclick = () => {
      const name = window.prompt(tr('name.q'), p.nickname || '');
      if (name !== null) post('/api/party/rename', { id: p.id, name });
    };
    menu.append(rename);
    more.append(sum, menu);
    c.append(more);
    return c;
  }

  function render() {
    canvases.length = 0;
    const party = $('party');
    party.textContent = '';
    for (const p of data.members) party.append(card(p, data.size));
    // One quiet card for the free places, not a wall of empty ones.
    const free = data.size - data.members.length;
    if (free > 0) {
      const slot = el('div', 'empty-slot');
      slot.append(Object.assign(el('img'), { src: '/ui/slot-empty.svg', alt: '' }), el('span', '', tr('party.emptySlots', { n: free })));
      party.append(slot);
    }
    $('party-count').textContent = `${data.members.length}/${data.size}`;
    const box = $('box');
    box.textContent = '';
    if (!data.box.length) box.append(el('p', 'muted', tr('party.boxEmpty')));
    for (const p of data.box) box.append(card(p, data.size));
    $('box-count').textContent = data.box.length ? String(data.box.length) : '';
    const up = $('upcoming');
    up.textContent = '';
    if (!data.upcoming.length) up.append(el('p', 'muted', tr('party.noUpcoming')));
    for (const u of data.upcoming) {
      const row = el('div');
      const bar = el('div', 'bar');
      const fill = el('i');
      fill.style.width = `${Math.min(100, Math.round((u.actions / u.needed) * 100))}%`;
      bar.append(fill);
      row.append(el('b', '', u.project), bar, el('small', 'muted', `${Math.min(u.actions, u.needed)}/${u.needed}`));
      up.append(row);
    }
    drawAll();
  }

  function drawAll(ms = performance.now()) {
    const dpr = window.devicePixelRatio || 1;
    const t = ms / 1000;
    canvases.forEach(([canvas, p], i) => {
      if (canvas.width !== 160 * dpr) {
        canvas.width = 160 * dpr;
        canvas.height = 160 * dpr;
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const k = canvas.width / 200;
      ctx.setTransform(k, 0, 0, k, 100 * k, 186 * k);
      const spec = { stage: p.stage, lineage: p.lineage, trait: p.trait, chimera: p.chimera, shiny: p.shiny && p.stage !== 'egg', wear: p.wear, legend: p.legend };
      // Resting in the Nest: asleep. In the Party: idle, each on its own rhythm.
      const pose = p.place === 'box' ? 'sleep' : 'idle';
      const anim = OpenmonMotion.poseAnim({ ...spec, pose, nature: p.nature || 'calm', t: t + i * 1.7, since: 0 });
      OpenmonArt.drawCreature(ctx, { ...spec, t: t + i * 1.7, size: 56, pose, anim });
    });
  }
  function frame(ms) {
    drawAll(ms);
    requestAnimationFrame(frame);
  }

  async function load() {
    const s = await (await fetch('/api/state')).json();
    data = s.party;
    cfg = s.config || {};
    if (data) render();
  }
  // Nest wallpaper: a per-viewer choice, remembered in this browser only.
  const WALLS = ['sky', 'forest', 'beach', 'desert', 'snow', 'night', 'workshop', 'library', 'lab', 'city', 'garden', 'space'];
  let wall = 'sky';
  try {
    wall = WALLS.includes(localStorage.getItem('openmon.boxWall')) ? localStorage.getItem('openmon.boxWall') : 'sky';
  } catch {}
  function renderWalls() {
    $('boxwrap').style.backgroundImage = `url(/ui/nest-${wall}.svg)`;
    const box = $('walls');
    box.textContent = '';
    for (const w of WALLS) {
      const b = el('button');
      b.style.backgroundImage = `url(/ui/nest-${w}.svg)`;
      b.title = tr(`party.wall.${w}`);
      b.setAttribute('aria-label', tr(`party.wall.${w}`));
      b.setAttribute('aria-pressed', String(w === wall));
      b.onclick = () => {
        wall = w;
        try {
          localStorage.setItem('openmon.boxWall', w);
        } catch {}
        renderWalls();
      };
      box.append(b);
    }
  }
  renderWalls();
  OpenmonArt.loadPack().then(load).then(() => requestAnimationFrame(frame));
  setTimeout(drawAll, 3500);
</script>
</body>
</html>
