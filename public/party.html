<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon Party</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding-bottom: 56px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .mon { position: relative; display: grid; justify-items: center; gap: 2px; padding: 10px 12px 14px; text-align: center; }
  .mon.active { box-shadow: var(--lift), 0 0 0 3px color-mix(in srgb, var(--sun) 70%, transparent); }
  .mon canvas { width: 150px; height: 150px; }
  .mon .name { font: 600 17px var(--font-display); }
  .mon .meta { font-size: 12.5px; color: var(--muted); }
  .mon .proj { margin-top: 4px; }
  .mon .tag { position: absolute; top: 10px; left: 10px; }
  .mon .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
  .mon .bar { width: 80%; height: 6px; margin-top: 4px; }
  .empty-slot { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 250px; border: 2px dashed var(--line); border-radius: var(--r-lg); color: var(--muted); text-align: center; padding: 16px; font-size: 13px; }
  .empty-slot img { width: 104px; height: 104px; opacity: 0.9; }
  .follow { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); width: 100%; justify-content: center; }
  .follow select { font: inherit; color: var(--text); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 2px 6px; max-width: 150px; }
  .section-title img { width: 30px; height: 30px; vertical-align: -7px; margin-right: 6px; }
  /* Project tag: the designer's plaque, a type-coloured dot with eyes and the name. */
  .ptag { display: inline-flex; align-items: center; gap: 7px; max-width: 170px; height: 34px; box-sizing: border-box; margin-top: 6px; padding: 0 10px 0 6px; border: 3px solid #2a2140; border-radius: 12px; background: #fffdf7; color: #2a2140; font: 600 14px var(--font-display); }
  .ptag i { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--c, #7c6cf2); box-shadow: inset 0 0 0 2px #2a2140; }
  .ptag i::before, .ptag i::after { content: ''; width: 3px; height: 5px; border-radius: 50%; background: #2a2140; }
  .ptag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The Box: a wallpaper behind the stored mons, picked by the trainer. */
  .boxwrap { border-radius: var(--r-lg); padding: 14px; background: center / cover no-repeat var(--sunken); border: var(--bw) solid var(--line); }
  .boxwrap .muted { background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 8px 12px; border-radius: var(--r-md); display: inline-block; }
  .walls { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: 10px; vertical-align: middle; }
  .walls button { width: 34px; height: 22px; padding: 0; border-radius: 7px; border: 2px solid var(--line); background: center / cover no-repeat; cursor: pointer; }
  .walls button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--sun); }
  .upcoming { display: grid; gap: 6px; max-width: 640px; }
  .upcoming div { display: grid; grid-template-columns: 1fr 160px auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: var(--r-md); background: var(--surface); border: var(--bw) solid var(--line); }
  .switch { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .switch input { width: 18px; height: 18px; accent-color: var(--brand); }
</style>
</head>
<body class="page" data-page="party">
<main class="wrap">
  <div class="hero"><div><h1 id="title"></h1><p id="sub"></p></div></div>
  <h2 class="section-title"><img src="/ui/party.svg" alt=""><span id="h-party"></span> <small id="party-count"></small></h2>
  <div class="grid" id="party"></div>
  <h2 class="section-title" id="h-upcoming"></h2>
  <p class="muted" id="upcoming-sub" style="margin:-4px 0 10px"></p>
  <div class="upcoming" id="upcoming"></div>
  <h2 class="section-title"><img src="/ui/box.svg" alt=""><span id="h-box"></span> <small id="box-count"></small><span class="walls" id="walls"></span></h2>
  <div class="boxwrap" id="boxwrap"><div class="grid" id="box"></div></div>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="art.js"></script>
<script src="motion.js"></script>
<script>
  const { t: tr, lang } = window.OpenmonI18n;
  document.documentElement.lang = lang;
  const $ = (id) => document.getElementById(id);
  for (const [id, key] of [['title', 'party.title'], ['sub', 'party.sub'], ['h-party', 'party.party'], ['h-box', 'party.box'], ['h-upcoming', 'party.upcoming'], ['upcoming-sub', 'party.upcomingSub']]) $(id).textContent = tr(key);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const canvases = [];
  let data = null;
  let cfg = {};
  // Season colours, only when turned on in Settings (same rule as the pet).
  const seasonNow = () => (cfg.seasons ? { 1: 'fev', 9: 'out', 11: 'dez' }[new Date().getMonth()] || null : null);

  async function post(path, body) {
    await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    await load();
  }

  function card(p, size) {
    const c = el('div', `mon panel${p.active ? ' active' : ''}`);
    const canvas = el('canvas');
    canvases.push([canvas, p]);
    const region = p.region ? ` · ${tr(`region.${p.region}`)}` : '';
    c.append(canvas, el('span', 'name', p.shiny && p.stage !== 'egg' ? `${p.name} ★` : p.name), el('span', 'meta', `${tr('card.level', { n: p.level })} · ${p.form}${region}`));
    const tag = el('span', 'ptag');
    // Legendaries and mystery eggs belong to no project.
    const special = p.legend ? tr('party.legendTag') : p.project && p.project.startsWith('mystery:') ? tr('party.mysteryTag') : null;
    const label = special || p.project || tr('party.general');
    const mystery = !p.legend && p.project && p.project.startsWith('mystery:');
    tag.title = mystery ? tr('party.mysteryHow') : special || (p.project ? tr('party.project', { project: p.project }) : tr('party.general'));
    tag.style.setProperty('--c', p.legend ? 'var(--sun)' : p.lineage && p.lineage !== 'chimera' ? `var(--${p.lineage})` : 'var(--brand)');
    tag.append(el('i'), el('span', '', label));
    c.append(tag);
    const bar = el('div', 'bar');
    const fill = el('i');
    fill.style.width = `${Math.round((p.progress || 0) * 100)}%`;
    bar.append(fill);
    c.append(bar);
    if (p.active || (cfg.companions || []).includes(p.id)) c.append(el('span', 'tag chip sun', tr('party.onScreen')));
    // Which project this pet follows: automatic, or a project pinned to it.
    if (p.place === 'party' && !p.legend) {
      const row = el('label', 'follow');
      row.append(el('span', '', tr('party.follows')));
      const sel = el('select');
      const projects = [...new Set([...data.members, ...data.box].map((m) => m.project).concat(data.upcoming.map((u) => u.project)).filter((x) => x && !x.startsWith('mystery:') && !x.startsWith('legend:')))].sort();
      const current = (cfg.follows || {})[p.id] || '';
      for (const [value, text] of [['', tr('party.followsAuto')], ...projects.map((x) => [x, x])]) {
        const o = el('option', '', text);
        o.value = value;
        o.selected = value === current;
        sel.append(o);
      }
      sel.title = tr('party.followsHelp');
      sel.onchange = () => post('/api/follow', { pet: p.id, project: sel.value || null });
      row.append(sel);
      c.append(row);
    }
    const actions = el('div', 'actions');
    if (!p.active) {
      const show = el('button', 'btn sm primary', tr('party.show'));
      show.onclick = () => post('/api/party/active', { id: p.id });
      actions.append(show);
      // Also on screen, next to the main one (up to 2 more).
      if (p.place === 'party') {
        const list = cfg.companions || [];
        const on = list.includes(p.id);
        const also = el('button', `btn sm${on ? ' brand' : ''}`, tr(on ? 'party.alsoOff' : 'party.alsoOn'));
        if (!on && list.length >= 2) {
          also.disabled = true;
          also.title = tr('party.alsoFull');
        }
        also.onclick = () => post('/api/config', { companions: on ? list.filter((x) => x !== p.id) : [...list, p.id] });
        actions.append(also);
      }
      const move = el('button', 'btn sm', p.place === 'box' ? tr('party.toParty') : tr('party.toBox'));
      move.onclick = () => post('/api/party/move', { id: p.id, place: p.place === 'box' ? 'party' : 'box' });
      if (p.place === 'box' && data.members.length >= size) {
        move.disabled = true;
        move.title = tr('party.full');
      }
      actions.append(move);
    }
    const rename = el('button', 'btn sm ghost', tr('party.rename'));
    rename.onclick = () => {
      const name = window.prompt(tr('name.q'), p.nickname || '');
      if (name !== null) post('/api/party/rename', { id: p.id, name });
    };
    actions.append(rename);
    c.append(actions);
    return c;
  }

  function render() {
    canvases.length = 0;
    const party = $('party');
    party.textContent = '';
    for (const p of data.members) party.append(card(p, data.size));
    // One quiet card for the free places, not a wall of empty ones.
    const free = data.size - data.members.length;
    if (free > 0) {
      const slot = el('div', 'empty-slot');
      slot.append(Object.assign(el('img'), { src: '/ui/slot-empty.svg', alt: '' }), el('span', '', tr('party.emptySlots', { n: free })));
      party.append(slot);
    }
    $('party-count').textContent = `${data.members.length}/${data.size}`;
    const box = $('box');
    box.textContent = '';
    if (!data.box.length) box.append(el('p', 'muted', tr('party.boxEmpty')));
    for (const p of data.box) box.append(card(p, data.size));
    $('box-count').textContent = data.box.length ? String(data.box.length) : '';
    const up = $('upcoming');
    up.textContent = '';
    if (!data.upcoming.length) up.append(el('p', 'muted', tr('party.noUpcoming')));
    for (const u of data.upcoming) {
      const row = el('div');
      const bar = el('div', 'bar');
      const fill = el('i');
      fill.style.width = `${Math.min(100, Math.round((u.actions / u.needed) * 100))}%`;
      bar.append(fill);
      row.append(el('b', '', u.project), bar, el('small', 'muted', `${Math.min(u.actions, u.needed)}/${u.needed}`));
      up.append(row);
    }
    drawAll();
  }

  function drawAll() {
    const dpr = window.devicePixelRatio || 1;
    for (const [canvas, p] of canvases) {
      canvas.width = 150 * dpr;
      canvas.height = 150 * dpr;
      const ctx = canvas.getContext('2d');
      const k = canvas.width / 200;
      ctx.setTransform(k, 0, 0, k, 100 * k, 182 * k);
      const spec = { stage: p.stage, lineage: p.lineage, trait: p.trait, chimera: p.chimera, nocturne: p.nocturne, shiny: p.shiny && p.stage !== 'egg', wear: p.wear, region: p.region, legend: p.legend, friend: p.friend, season: seasonNow() };
      OpenmonArt.drawCreature(ctx, { ...spec, t: 1, size: 56, pose: 'idle', anim: { eyes: 'happy', mouth: 'grin' } });
    }
  }

  async function load() {
    const s = await (await fetch('/api/state')).json();
    data = s.party;
    cfg = s.config || {};
    if (data) render();
  }
  // Box wallpaper: a per-viewer choice, remembered in this browser only.
  const WALLS = ['sky', 'forest', 'beach', 'desert', 'snow', 'night', 'workshop', 'library', 'lab', 'city', 'garden', 'space'];
  let wall = 'sky';
  try {
    wall = WALLS.includes(localStorage.getItem('openmon.boxWall')) ? localStorage.getItem('openmon.boxWall') : 'sky';
  } catch {}
  function renderWalls() {
    $('boxwrap').style.backgroundImage = `url(/ui/box-${wall}.svg)`;
    const box = $('walls');
    box.textContent = '';
    for (const w of WALLS) {
      const b = el('button');
      b.style.backgroundImage = `url(/ui/box-${w}.svg)`;
      b.title = tr(`party.wall.${w}`);
      b.setAttribute('aria-label', tr(`party.wall.${w}`));
      b.setAttribute('aria-pressed', String(w === wall));
      b.onclick = () => {
        wall = w;
        try {
          localStorage.setItem('openmon.boxWall', w);
        } catch {}
        renderWalls();
      };
      box.append(b);
    }
  }
  renderWalls();
  OpenmonArt.loadPack().then(load);
  setTimeout(drawAll, 1500);
  setTimeout(drawAll, 3500);
</script>
</body>
</html>
