<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon Skills</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding-bottom: 48px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: stretch; }
  .wait { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; padding: 14px 16px; }
  .wait .big-number { grid-row: span 2; }
  .wait .now { grid-column: 1 / -1; margin-top: 8px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--sun); color: #2a2140; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .wait .now button { flex: none; }
  .sessions-box { padding: 12px 14px; }
  .sessions-box h3 { margin: 0 0 8px; font-size: 14px; }
  .sessions { display: flex; flex-wrap: wrap; gap: 6px; }
  .sessions .recap { flex-basis: 100%; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .journal { margin-top: 14px; padding: 14px 16px; }
  .top { margin-top: 14px; }
  .journal h3 { margin: 0; font-size: 16px; }
  .journal .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .journal .head p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .chart { display: grid; grid-template-columns: repeat(14, 1fr); align-items: end; gap: 6px; height: 120px; padding-bottom: 2px; border-bottom: 2px solid var(--line); }
  .col { display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start; border-radius: 6px 6px 2px 2px; cursor: pointer; overflow: hidden; background: var(--surface-2); }
  .col i { display: block; width: 100%; }
  .col:hover, .col.on { box-shadow: 0 0 0 2px var(--outline); }
  .days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; margin-top: 4px; font-size: 10.5px; color: var(--muted); text-align: center; }
  .days .today { color: var(--ink); font-weight: 800; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }
  .day-detail { margin-top: 10px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 13px; min-height: 40px; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  .totals div { padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); }
  .totals b { display: block; font: 600 20px var(--font-display); font-variant-numeric: tabular-nums; }
  .totals small { color: var(--muted); font-size: 11.5px; }
  .timeline { margin-top: 12px; padding: 14px 16px; }
  .tl-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .tl-head h3 { margin: 0; font-size: 16px; }
  .tl-head .input { flex: 1; min-width: 200px; max-width: 360px; min-height: 34px; font: 500 14px var(--font-body); }
  #timeline { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
  #timeline li { display: grid; grid-template-columns: 64px 18px 1fr auto; gap: 8px; align-items: baseline; padding: 4px 6px; border-top: 1px solid var(--line); font-size: 13px; }
  #timeline li.prompt { background: var(--surface-2); font-weight: 650; }
  #timeline li time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  #timeline li .who { color: var(--muted); font-size: 12px; }
  .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-top: 8px; }
  .tab { font: inherit; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 8px; border: var(--bw) solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: var(--r-md); background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--c) 28%, var(--surface)), var(--surface) 70%); color: var(--ink); cursor: pointer; box-shadow: var(--gloss); transition: transform 0.08s ease; }
  .tab:hover { transform: translateY(-2px); border-color: var(--c); }
  .tab img { width: 56px; height: 56px; object-fit: contain; }
  .tab .pw-ic { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; color: var(--muted); }
  .tab .pw-ic svg, .tab .pw-ic img { width: 18px; height: 18px; }
  .tab.locked { background: var(--surface-2); border-color: var(--line); }
  .tab b { font: 600 13px var(--font-display); }
  .tab small { font-size: 11px; color: var(--muted); }
  .tab.on { border-color: var(--outline); box-shadow: 0 3px 0 var(--outline), inset 0 -5px 0 var(--c); }
  .tab.locked img { filter: grayscale(1) brightness(0.3); opacity: 0.55; }
  .panel-body { margin-top: 12px; padding: 16px 18px; min-height: 180px; border-top: 6px solid var(--c, var(--brand)); }
  .panel-body h2 { margin: 0 0 2px; font-size: 19px; }
  .panel-body > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 650; font-size: 12px; border-top: 0; }
  tr:hover td { background: var(--surface-2); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .add { color: var(--ok); font-weight: 700; } .del { color: var(--bad); font-weight: 700; }
  .ok { color: var(--ok); font-weight: 800; } .bad { color: var(--bad); font-weight: 800; }
  .lock { text-align: center; padding: 24px 8px; }
  .lock img { width: 96px; height: 96px; object-fit: contain; filter: grayscale(1) brightness(0.3); opacity: 0.55; }
  @media (max-width: 720px) { .top { grid-template-columns: 1fr; } .tabs { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body class="page" data-page="powers">
<main class="wrap">
  <div class="hero"><div><h1 id="title">Skills</h1><p id="sub"></p></div></div>
  <div class="tabs" id="tabs"></div>
  <section class="panel panel-body" id="panel"></section>
  <section class="journal panel soft" id="journal"></section>
  <div class="top">
    <section class="wait panel" id="wait"></section>
    <section class="sessions-box panel soft"><h3 id="h-sessions"></h3><div class="sessions" id="sessions"></div></section>
  </div>
  <section class="panel soft timeline" id="timeline-box">
    <div class="tl-head"><h3 id="h-timeline"></h3><input class="input" id="search" type="search" autocomplete="off"></div>
    <ol id="timeline"></ol>
  </section>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script>
  const { t: tr, lang } = window.OpenmonI18n;
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = tr('powers.title');
  document.getElementById('sub').textContent = tr('powers.sub');
  document.getElementById('h-sessions').textContent = tr('powers.sessions');
  const POWERS = ['craft', 'lore', 'shell', 'test', 'roam', 'swarm', 'docs', 'git', 'debug', 'data', 'style'];
  let data = null;
  let live = null;
  let selected = null;
  let tab = new URLSearchParams(location.search).get('tab') || null;
  let picked = Boolean(tab);

  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) k === 'class' ? (e.className = v) : e.setAttribute(k, v);
    for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  };
  const dur = (ms) => {
    if (ms == null) return '–';
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
  };
  const ago = (at) => tr('powers.ago', { t: dur(Date.now() - at) });

  function renderWait() {
    const box = $('wait');
    box.textContent = '';
    const today = data.today || {};
    box.append(h('div', { class: 'big-number' }, dur(today.waitMs || 0)), h('div', {}, h('b', {}, tr('powers.waited'))), h('div', { class: 'muted' }, today.waits ? tr('powers.waitedSub', { n: today.waits, fast: dur(today.fastestMs) }) : tr('powers.noWaits')));
    const waiting = live && live.pose === 'attention' && live.focus ? live.focus : null;
    if (waiting) {
      const go = h('button', { class: 'btn sm' }, tr('session.go'));
      go.onclick = () => fetch('/api/focus', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: waiting.id }) });
      box.append(h('div', { class: 'now' }, h('span', {}, tr('powers.waitingNow', { label: waiting.label, t: dur(Date.now() - waiting.since) })), go));
    }
  }

  function renderSessions() {
    const box = $('sessions');
    box.textContent = '';
    if (!data.sessions.length) return box.append(h('span', { class: 'muted' }, tr('powers.noSessions')));
    if (!selected || !data.sessions.some((s) => s.id === selected)) selected = data.sessions[0].id;
    for (const s of data.sessions) {
      const b = h('button', { class: 'chip', 'aria-pressed': String(s.id === selected) }, h('b', {}, s.label), h('span', { class: 'muted' }, s.ended ? tr('powers.ended') : ago(s.lastAt)));
      b.onclick = () => { selected = s.id; render(); };
      box.append(b);
    }
    const current = data.sessions.find((x) => x.id === selected);
    if (current && current.lastTurn) box.append(h('div', { class: 'recap' }, recapText(current.lastTurn)));
  }

  function recapText(r) {
    if (!r) return '';
    const bits = [];
    if (r.files) bits.push(tr(r.files === 1 ? 'recap.file' : 'recap.files', { n: r.files }));
    if (r.commands) bits.push(tr(r.commands === 1 ? 'recap.command' : 'recap.commands', { n: r.commands }));
    if (r.green || r.red) bits.push(r.red && !r.green ? tr('recap.testsRed') : r.red ? tr('recap.testsMixed', { g: r.green, r: r.red }) : tr('recap.testsGreen'));
    if (r.reads) bits.push(tr(r.reads === 1 ? 'recap.read' : 'recap.reads', { n: r.reads }));
    if (r.agents) bits.push(tr(r.agents === 1 ? 'recap.agent' : 'recap.agents', { n: r.agents }));
    bits.push(dur(r.ms));
    return tr('powers.lastTurn', { recap: bits.join(' · ') });
  }

  function renderTabs() {
    const box = $('tabs');
    box.textContent = '';
    // Until the user picks a tab, show the first unlocked power.
    if (!picked) tab = data.unlocked[0] || 'craft';
    for (const p of POWERS) {
      const locked = !data.unlocked.includes(p);
      const b = h('button', { class: `tab${p === tab ? ' on' : ''}${locked ? ' locked' : ''}`, style: `--c: var(--${p})`, title: locked ? tr('powers.lockedShort') : '' },
        h('img', { src: `/art/${p}-juvenile.svg`, alt: '' }), h('b', {}, tr(`power.${p}`)), h('small', {}, locked ? tr('powers.lockedShort') : tr(`power.${p}.short`)), locked ? lockIcon() : powerIcon(p));
      b.onclick = () => { tab = p; picked = true; render(); };
      box.append(b);
    }
  }

  // Drawn icons until the designer's public/icons/power-<id>.svg exist.
  const svgIcon = (d) => {
    const span = document.createElement('span');
    span.className = 'pw-ic';
    span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    return span;
  };
  const lockIcon = () => svgIcon('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>');
  function powerIcon(p) {
    const span = svgIcon('<circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>');
    const img = new Image();
    img.alt = '';
    img.onload = () => span.replaceChildren(img);
    img.src = `/icons/power-${p}.svg`;
    return span;
  }

  const copyBtn = (text) => {
    const b = h('button', { class: 'btn ghost sm' }, tr('powers.copy'));
    b.onclick = () => navigator.clipboard.writeText(text).then(() => (b.textContent = '✓'));
    return b;
  };

  // Files with edits and lines in and out (Craft, Docs, Style).
  const fileTable = (files) => (files && files.length
    ? h('table', {}, h('tr', {}, h('th', {}, tr('powers.file')), h('th', { class: 'n' }, tr('powers.edits')), h('th', { class: 'n' }, tr('powers.lines'))),
      files.map((f) => h('tr', { title: f.file }, h('td', {}, h('code', {}, f.name)), h('td', { class: 'n' }, f.edits), h('td', { class: 'n' }, h('span', { class: 'add' }, `+${f.added}`), ' ', h('span', { class: 'del' }, `−${f.removed}`)))))
    : null);
  const VIEWS = {
    craft: (s) => fileTable(s.craft),
    docs: (s) => fileTable(s.docs),
    style: (s) => fileTable(s.style),
    git(s) {
      if (!s.git || !s.git.commands.length) return null;
      const head = h('p', {}, h('span', { class: 'chip sun' }, tr(s.git.commits === 1 ? 'powers.commit1' : 'powers.commits', { n: s.git.commits })));
      return h('div', {}, head, h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.command')), h('th', { class: 'n' }, ''), h('th', {}, '')),
        s.git.commands.map((c) => h('tr', {}, h('td', {}, h('span', { class: c.ok ? 'ok' : 'bad' }, c.ok ? '✓' : '✗')), h('td', {}, h('code', {}, c.command)), h('td', { class: 'n muted' }, ago(c.at)), h('td', { class: 'n' }, copyBtn(c.command))))));
    },
    debug(s) {
      if (!s.debug || (!s.debug.fixes.length && !s.debug.open)) return null;
      const open = s.debug.open ? h('p', {}, h('span', { class: 'chip' }, tr('powers.openFail')), ' ', h('code', {}, s.debug.open.target || s.debug.open.tool), h('span', { class: 'muted' }, ` · ${ago(s.debug.open.at)}`)) : null;
      return h('div', {}, open, s.debug.fixes.length ? h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.fixed')), h('th', { class: 'n' }, tr('powers.tries')), h('th', { class: 'n' }, tr('powers.timeToFix'))),
        s.debug.fixes.map((x) => h('tr', {}, h('td', {}, h('span', { class: 'ok' }, '✓')), h('td', {}, h('code', {}, x.target || x.tool)), h('td', { class: 'n' }, x.tries), h('td', { class: 'n muted' }, dur(x.fixedAt - x.failedAt))))) : null);
    },
    data(s) {
      if (!s.data || (!s.data.files.length && !s.data.queries.length)) return null;
      return h('div', {},
        s.data.files.length ? h('table', {}, h('tr', {}, h('th', {}, tr('powers.file')), h('th', { class: 'n' }, tr('powers.times')), h('th', { class: 'n' }, tr('powers.edits'))), s.data.files.map((f) => h('tr', { title: f.file }, h('td', {}, h('code', {}, f.name)), h('td', { class: 'n' }, `×${f.reads}`), h('td', { class: 'n' }, f.edits)))) : null,
        s.data.queries.length ? h('table', { style: 'margin-top:10px' }, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.query')), h('th', { class: 'n' }, tr('powers.time')), h('th', {}, '')), s.data.queries.map((c) => h('tr', {}, h('td', {}, h('span', { class: c.ok ? 'ok' : 'bad' }, c.ok ? '✓' : '✗')), h('td', {}, h('code', {}, c.command)), h('td', { class: 'n muted' }, dur(c.ms)), h('td', { class: 'n' }, copyBtn(c.command))))) : null);
    },
    lore(s) {
      if (!s.lore.reads.length && !s.lore.searches.length) return null;
      return h('div', {},
        s.lore.reads.length ? h('table', {}, h('tr', {}, h('th', {}, tr('powers.read')), h('th', { class: 'n' }, tr('powers.times'))), s.lore.reads.map((r) => h('tr', { title: r.file }, h('td', {}, h('code', {}, r.name)), h('td', { class: 'n' }, `×${r.count}`)))) : null,
        s.lore.searches.length ? h('table', { style: 'margin-top:10px' }, h('tr', {}, h('th', {}, tr('powers.searches')), h('th', { class: 'n' }, '')), s.lore.searches.map((q) => h('tr', {}, h('td', {}, h('code', {}, q.pattern), q.where ? h('span', { class: 'muted' }, ` · ${q.where}`) : null), h('td', { class: 'n muted' }, q.tool)))) : null);
    },
    shell(s) {
      if (!s.shell.length) return null;
      return h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.command')), h('th', { class: 'n' }, tr('powers.time')), h('th', {}, '')),
        s.shell.map((c) => h('tr', {}, h('td', {}, h('span', { class: c.ok ? 'ok' : 'bad' }, c.ok ? '✓' : '✗')), h('td', {}, h('code', {}, c.command)), h('td', { class: 'n muted' }, dur(c.ms)), h('td', { class: 'n' }, copyBtn(c.command)))));
    },
    test(s) {
      if (!s.test.runs.length) return null;
      const head = h('p', {}, h('span', { class: 'chip sun' }, s.test.streak === 1 ? tr('powers.streak1') : tr('powers.streak', { n: s.test.streak })), ' ', s.test.lastGreenAt ? tr('powers.lastGreen', { t: ago(s.test.lastGreenAt) }) : tr('powers.neverGreen'));
      return h('div', {}, head, h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.run')), h('th', { class: 'n' }, tr('powers.time'))),
        s.test.runs.map((r) => h('tr', {}, h('td', {}, h('span', { class: r.passed === true ? 'ok' : r.passed === false ? 'bad' : 'muted' }, r.passed === true ? '✓' : r.passed === false ? '✗' : '?')), h('td', {}, h('code', {}, r.command), r.summary ? h('div', { class: 'muted' }, r.summary) : null), h('td', { class: 'n muted' }, dur(r.ms))))));
    },
    roam(s) {
      if (!s.roam.length) return null;
      const icon = { page: '↗', search: '⌕', mcp: '◇' };
      return h('table', {}, s.roam.map((w) => h('tr', {}, h('td', {}, icon[w.kind] || '•'), h('td', {}, h('code', {}, w.target)), h('td', { class: 'n muted' }, ago(w.at)), h('td', { class: 'n' }, copyBtn(w.target)))));
    },
    swarm(s) {
      if (!s.swarm.length) return null;
      return h('table', {}, h('tr', {}, h('th', {}, tr('powers.agent')), h('th', {}, tr('powers.status')), h('th', { class: 'n' }, tr('powers.time'))),
        s.swarm.map((a) => h('tr', {}, h('td', {}, h('code', {}, a.type)), h('td', {}, a.endedAt ? h('span', { class: 'ok' }, tr('powers.done')) : h('b', {}, tr('powers.running'))), h('td', { class: 'n muted' }, dur((a.endedAt || Date.now()) - a.startedAt)))));
    },
  };

  function renderPanel() {
    const box = $('panel');
    box.textContent = '';
    box.style.setProperty('--c', `var(--${tab})`);
    box.append(h('h2', {}, `${tr(`power.${tab}`)} · ${tr(`power.${tab}.title`)}`), h('p', {}, tr(`power.${tab}.text`)));
    if (!data.unlocked.includes(tab)) {
      box.append(h('div', { class: 'lock' }, h('img', { src: `/art/${tab}-juvenile.svg`, alt: '' }), h('p', {}, h('b', {}, tr('powers.locked', { lineage: tr(`power.${tab}`) }))), h('p', { class: 'muted' }, tr('powers.lockedHow', { work: tr(`work.${tab}`) }))));
      return;
    }
    const s = data.sessions.find((x) => x.id === selected);
    const view = s ? VIEWS[tab](s) : null;
    box.append(view || h('div', { class: 'empty' }, tr('powers.nothing')));
  }

  // The journal: the last 14 days of agent work, by kind of work.
  const FAMILIES = POWERS;
  let pickedDay = null;
  const dayLabel = (key, opts) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(lang, opts);
  };
  function lastDays(journal) {
    const byDay = Object.fromEntries((journal || []).map((e) => [e.day, e]));
    const out = [];
    const d = new Date();
    for (let i = 13; i >= 0; i--) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
      const key = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
      out.push(byDay[key] || { day: key, tools: 0, edits: 0, green: 0, red: 0, turns: 0, waitMs: 0, waits: 0, families: {}, projects: {} });
    }
    return out;
  }
  function dayText(e) {
    if (!e.tools && !e.turns) return tr('journal.quiet', { day: dayLabel(e.day, { weekday: 'long', day: 'numeric', month: 'short' }) });
    const projects = Object.entries(e.projects || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([p, n]) => `${p} (${n})`).join(', ');
    const bits = [
      tr('journal.tools', { n: e.tools }),
      e.turns ? tr('journal.turns', { n: e.turns }) : null,
      e.green || e.red ? tr('journal.tests', { g: e.green, r: e.red }) : null,
      e.waitMs ? tr('journal.waited', { t: dur(e.waitMs) }) : null,
      e.tokens ? tr('yesterday.tokens', { n: new Intl.NumberFormat(lang, { notation: 'compact', maximumFractionDigits: 1 }).format(e.tokens) }) : null,
    ].filter(Boolean);
    return `${dayLabel(e.day, { weekday: 'long', day: 'numeric', month: 'short' })} · ${bits.join(' · ')}${projects ? ` · ${projects}` : ''}`;
  }
  function standupText(days) {
    const line = (e) => {
      if (!e || (!e.tools && !e.turns)) return tr('standup.quiet');
      const projects = Object.entries(e.projects || {}).sort((a, b) => b[1] - a[1]).map(([p]) => p).slice(0, 4).join(', ');
      const tests = (e.green || 0) + (e.red || 0);
      return [projects ? tr('standup.projects', { p: projects }) : null, tr('journal.turns', { n: e.turns || 0 }), tr('journal.tools', { n: e.tools }), tests ? tr('standup.tests', { g: e.green || 0, t: tests }) : null].filter(Boolean).join(' · ');
    };
    const today = days[days.length - 1];
    const yesterday = [...days.slice(0, -1)].reverse().find((e) => e.tools || e.turns);
    return `${tr('standup.yesterday')}: ${line(yesterday)}\n${tr('standup.today')}: ${line(today)}`;
  }

  function renderJournal() {
    const box = $('journal');
    box.textContent = '';
    const days = lastDays(data.journal);
    const head = h('div', { class: 'head' }, h('h3', {}, tr('journal.title')), h('p', {}, tr('journal.sub')));
    if (data.streak && data.streak.days > 1) head.append(h('span', { class: 'chip sun' }, tr('today.streak', { n: data.streak.days })));
    const max = Math.max(1, ...days.map((e) => e.tools));
    const chart = h('div', { class: 'chart' });
    const labels = h('div', { class: 'days' });
    const detail = h('div', { class: 'day-detail' });
    const today = days[days.length - 1].day;
    if (!pickedDay) pickedDay = today;
    for (const e of days) {
      const col = h('div', { class: `col${e.day === pickedDay ? ' on' : ''}`, title: dayText(e) });
      col.style.height = `${Math.max(3, (e.tools / max) * 100)}%`;
      const total = Math.max(1, Object.values(e.families || {}).reduce((a, b) => a + b, 0));
      for (const fam of FAMILIES) {
        const n = (e.families || {})[fam] || 0;
        if (!n) continue;
        const seg = h('i');
        seg.style.height = `${(n / total) * 100}%`;
        seg.style.background = `var(--${fam})`;
        col.append(seg);
      }
      col.onmouseenter = () => (detail.textContent = dayText(e));
      col.onclick = () => {
        pickedDay = e.day;
        renderJournal();
      };
      chart.append(col);
      labels.append(h('span', { class: e.day === today ? 'today' : '' }, e.day === today ? tr('journal.today') : dayLabel(e.day, { weekday: 'narrow' })));
    }
    chart.onmouseleave = () => (detail.textContent = dayText(days.find((x) => x.day === pickedDay) || days[days.length - 1]));
    detail.textContent = dayText(days.find((x) => x.day === pickedDay) || days[days.length - 1]);
    const legend = h('div', { class: 'legend' }, FAMILIES.map((fam) => {
      const sp = h('span', {}, tr(`power.${fam}`));
      sp.style.setProperty('--c', `var(--${fam})`);
      return sp;
    }));
    // The last 7 days in four numbers.
    const week = days.slice(-7);
    const sum = (k) => week.reduce((a, e) => a + (e[k] || 0), 0);
    const tests = sum('green') + sum('red');
    const proj = {};
    for (const e of week) for (const [p, n] of Object.entries(e.projects || {})) proj[p] = (proj[p] || 0) + n;
    const top = Object.entries(proj).sort((a, b) => b[1] - a[1])[0];
    const totals = h('div', { class: 'totals' },
      h('div', {}, h('b', {}, String(sum('tools'))), h('small', {}, tr('journal.weekTools'))),
      h('div', {}, h('b', {}, String(sum('turns'))), h('small', {}, tr('journal.weekTurns'))),
      h('div', {}, h('b', {}, tests ? `${Math.round((sum('green') / tests) * 100)}%` : '–'), h('small', {}, tr('journal.weekGreen'))),
      h('div', {}, h('b', {}, dur(sum('waitMs'))), h('small', {}, tr('journal.weekWait'))),
      h('div', { title: tr('today.tokensHelp') }, h('b', {}, new Intl.NumberFormat(lang, { notation: 'compact', maximumFractionDigits: 1 }).format(sum('tokens'))), h('small', {}, tr('journal.weekTokens'))),
      h('div', {}, h('b', { style: 'font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, top ? top[0] : '–'), h('small', {}, tr('journal.weekTop'))));
    // A ready-to-paste update for your daily stand-up.
    const standup = h('button', { class: 'btn sm', style: 'margin-top:10px' }, tr('standup.copy'));
    standup.onclick = () => navigator.clipboard.writeText(standupText(days)).then(() => (standup.textContent = tr('standup.copied')));
    const csv = h('button', { class: 'btn sm', style: 'margin:10px 0 0 8px' }, tr('csv.button'));
    csv.title = tr('csv.help');
    csv.onclick = () => {
      const blob = new Blob([`\ufeff${hoursCsv(data.journal)}`], { type: 'text/csv' });
      const a = h('a', { href: URL.createObjectURL(blob), download: 'openmon-hours.csv' });
      document.body.append(a);
      a.click();
      a.remove();
    };
    box.append(head, chart, labels, legend, detail, totals, standup, csv);
  }

  // Timeline of the selected session, or a search across every session.
  const TL_ICON = { prompt: '›', stop: '✓', ask: '!', agent: '✦', compact: '⋯' };
  function renderTimeline() {
    $('h-timeline').textContent = tr('timeline.title');
    $('search').placeholder = tr('timeline.search');
    const q = $('search').value.trim().toLowerCase();
    const list = $('timeline');
    list.textContent = '';
    let items = [];
    if (q) {
      for (const s of data.sessions) for (const it of s.timeline || []) if ((it.target || '').toLowerCase().includes(q) || (it.tool || '').toLowerCase().includes(q)) items.push({ ...it, session: s.label });
      items.sort((a, b) => b.at - a.at);
    } else {
      const s = data.sessions.find((x) => x.id === selected);
      items = s ? [...(s.timeline || [])].reverse() : [];
    }
    if (!items.length) return list.append(h('li', { class: 'empty' }, q ? tr('timeline.none') : tr('powers.nothing')));
    for (const it of items.slice(0, 300)) {
      const icon = it.kind === 'tool' ? (it.ok ? '✓' : '✗') : TL_ICON[it.kind] || '•';
      const text = it.kind === 'prompt' ? tr('timeline.prompt') : it.kind === 'stop' ? tr('timeline.stop') : it.kind === 'ask' ? tr('timeline.ask', { what: `${it.tool || ''} ${it.target || ''}`.trim() }) : it.kind === 'agent' ? tr('timeline.agent', { what: it.target }) : it.kind === 'compact' ? tr('timeline.compact') : `${it.tool}  ${it.target || ''}`;
      list.append(h('li', { class: it.kind }, h('time', {}, new Date(it.at).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' })), h('span', { class: it.ok === false ? 'bad' : '' }, icon), h('code', {}, text), h('span', { class: 'who' }, it.session || (it.ms ? dur(it.ms) : ''))));
    }
  }

  // Agent hours per project, as a CSV for timesheets.
  function hoursCsv(journal) {
    const rows = [[tr('csv.date'), tr('csv.project'), tr('csv.hours'), tr('csv.actions')]];
    for (const e of journal || []) {
      const total = Object.values(e.projects || {}).reduce((a, b) => a + b, 0) || 1;
      for (const [project, ms] of Object.entries(e.agentMs || {})) {
        const actions = Math.round(((e.projects || {})[project] || 0));
        rows.push([e.day, project, (ms / 3600000).toFixed(2), actions || Math.round(e.tools * ((e.projects || {})[project] || 0) / total)]);
      }
    }
    return rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  }

  function render() {
    if (!data) return;
    renderJournal();
    renderTimeline();
    renderWait();
    renderSessions();
    renderTabs();
    renderPanel();
  }

  let pending = null;
  async function refresh() {
    try {
      data = await (await fetch('/api/powers')).json();
      render();
    } catch {}
  }
  const es = new EventSource('/stream');
  es.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'state') live = msg.live;
    clearTimeout(pending);
    pending = setTimeout(refresh, 300);
  };
  // The waiting timer ticks every second.
  setInterval(() => data && renderWait(), 1000);
  $('search').addEventListener('input', () => data && renderTimeline());
  refresh();
</script>
</body>
</html>
