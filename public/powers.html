<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon Powers</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding-bottom: 48px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: stretch; }
  .wait { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; padding: 14px 16px; }
  .wait .big-number { grid-row: span 2; }
  .wait .now { grid-column: 1 / -1; margin-top: 8px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--sun); color: #2a2140; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .wait .now button { flex: none; }
  .sessions-box { padding: 12px 14px; }
  .sessions-box h3 { margin: 0 0 8px; font-size: 14px; }
  .sessions { display: flex; flex-wrap: wrap; gap: 6px; }
  .sessions .recap { flex-basis: 100%; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 22px; }
  .tab { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border: var(--bw) solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); cursor: pointer; transition: transform 0.08s ease; }
  .tab:hover { transform: translateY(-2px); border-color: var(--c); }
  .tab img { width: 46px; height: 46px; object-fit: contain; }
  .tab b { font: 600 13px var(--font-display); }
  .tab small { font-size: 11px; color: var(--muted); }
  .tab.on { border-color: var(--outline); box-shadow: 0 3px 0 var(--outline), inset 0 -5px 0 var(--c); }
  .tab.locked img { filter: grayscale(1) brightness(0.3); opacity: 0.55; }
  .panel-body { margin-top: 12px; padding: 16px 18px; min-height: 180px; border-top: 6px solid var(--c, var(--brand)); }
  .panel-body h2 { margin: 0 0 2px; font-size: 19px; }
  .panel-body > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 650; font-size: 12px; border-top: 0; }
  tr:hover td { background: var(--surface-2); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .add { color: var(--ok); font-weight: 700; } .del { color: var(--bad); font-weight: 700; }
  .ok { color: var(--ok); font-weight: 800; } .bad { color: var(--bad); font-weight: 800; }
  .lock { text-align: center; padding: 24px 8px; }
  .lock img { width: 96px; height: 96px; object-fit: contain; filter: grayscale(1) brightness(0.3); opacity: 0.55; }
  @media (max-width: 720px) { .top { grid-template-columns: 1fr; } .tabs { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body class="page" data-page="powers">
<main class="wrap">
  <div class="hero"><div><h1 id="title">Powers</h1><p id="sub"></p></div></div>
  <div class="top">
    <section class="wait panel" id="wait"></section>
    <section class="sessions-box panel soft"><h3 id="h-sessions"></h3><div class="sessions" id="sessions"></div></section>
  </div>
  <div class="tabs" id="tabs"></div>
  <section class="panel panel-body" id="panel"></section>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script>
  const { t: tr, lang } = window.OpenmonI18n;
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = tr('powers.title');
  document.getElementById('sub').textContent = tr('powers.sub');
  document.getElementById('h-sessions').textContent = tr('powers.sessions');
  const POWERS = ['craft', 'lore', 'shell', 'test', 'roam', 'swarm'];
  let data = null;
  let live = null;
  let selected = null;
  let tab = new URLSearchParams(location.search).get('tab') || null;
  let picked = Boolean(tab);

  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) k === 'class' ? (e.className = v) : e.setAttribute(k, v);
    for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  };
  const dur = (ms) => {
    if (ms == null) return '–';
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
  };
  const ago = (at) => tr('powers.ago', { t: dur(Date.now() - at) });

  function renderWait() {
    const box = $('wait');
    box.textContent = '';
    const today = data.today || {};
    box.append(h('div', { class: 'big-number' }, dur(today.waitMs || 0)), h('div', {}, h('b', {}, tr('powers.waited'))), h('div', { class: 'muted' }, today.waits ? tr('powers.waitedSub', { n: today.waits, fast: dur(today.fastestMs) }) : tr('powers.noWaits')));
    const waiting = live && live.pose === 'attention' && live.focus ? live.focus : null;
    if (waiting) {
      const go = h('button', { class: 'btn sm' }, tr('session.go'));
      go.onclick = () => fetch('/api/focus', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: waiting.id }) });
      box.append(h('div', { class: 'now' }, h('span', {}, tr('powers.waitingNow', { label: waiting.label, t: dur(Date.now() - waiting.since) })), go));
    }
  }

  function renderSessions() {
    const box = $('sessions');
    box.textContent = '';
    if (!data.sessions.length) return box.append(h('span', { class: 'muted' }, tr('powers.noSessions')));
    if (!selected || !data.sessions.some((s) => s.id === selected)) selected = data.sessions[0].id;
    for (const s of data.sessions) {
      const b = h('button', { class: 'chip', 'aria-pressed': String(s.id === selected) }, h('b', {}, s.label), h('span', { class: 'muted' }, s.ended ? tr('powers.ended') : ago(s.lastAt)));
      b.onclick = () => { selected = s.id; render(); };
      box.append(b);
    }
    const current = data.sessions.find((x) => x.id === selected);
    if (current && current.lastTurn) box.append(h('div', { class: 'recap' }, recapText(current.lastTurn)));
  }

  function recapText(r) {
    if (!r) return '';
    const bits = [];
    if (r.files) bits.push(tr(r.files === 1 ? 'recap.file' : 'recap.files', { n: r.files }));
    if (r.commands) bits.push(tr(r.commands === 1 ? 'recap.command' : 'recap.commands', { n: r.commands }));
    if (r.green || r.red) bits.push(r.red && !r.green ? tr('recap.testsRed') : r.red ? tr('recap.testsMixed', { g: r.green, r: r.red }) : tr('recap.testsGreen'));
    if (r.reads) bits.push(tr(r.reads === 1 ? 'recap.read' : 'recap.reads', { n: r.reads }));
    if (r.agents) bits.push(tr(r.agents === 1 ? 'recap.agent' : 'recap.agents', { n: r.agents }));
    bits.push(dur(r.ms));
    return tr('powers.lastTurn', { recap: bits.join(' · ') });
  }

  function renderTabs() {
    const box = $('tabs');
    box.textContent = '';
    // Until the user picks a tab, show the first unlocked power.
    if (!picked) tab = data.unlocked[0] || 'craft';
    for (const p of POWERS) {
      const locked = !data.unlocked.includes(p);
      const b = h('button', { class: `tab${p === tab ? ' on' : ''}${locked ? ' locked' : ''}`, style: `--c: var(--${p})`, title: locked ? tr('powers.lockedShort') : '' },
        h('img', { src: `/art/${p}-juvenile.svg`, alt: '' }), h('b', {}, tr(`power.${p}`)), h('small', {}, locked ? '🔒' : tr(`power.${p}.short`)));
      b.onclick = () => { tab = p; picked = true; render(); };
      box.append(b);
    }
  }

  const copyBtn = (text) => {
    const b = h('button', { class: 'btn ghost sm' }, tr('powers.copy'));
    b.onclick = () => navigator.clipboard.writeText(text).then(() => (b.textContent = '✓'));
    return b;
  };

  const VIEWS = {
    craft(s) {
      if (!s.craft.length) return null;
      return h('table', {}, h('tr', {}, h('th', {}, tr('powers.file')), h('th', { class: 'n' }, tr('powers.edits')), h('th', { class: 'n' }, tr('powers.lines'))),
        s.craft.map((f) => h('tr', { title: f.file }, h('td', {}, h('code', {}, f.name)), h('td', { class: 'n' }, f.edits), h('td', { class: 'n' }, h('span', { class: 'add' }, `+${f.added}`), ' ', h('span', { class: 'del' }, `−${f.removed}`)))));
    },
    lore(s) {
      if (!s.lore.reads.length && !s.lore.searches.length) return null;
      return h('div', {},
        s.lore.reads.length ? h('table', {}, h('tr', {}, h('th', {}, tr('powers.read')), h('th', { class: 'n' }, tr('powers.times'))), s.lore.reads.map((r) => h('tr', { title: r.file }, h('td', {}, h('code', {}, r.name)), h('td', { class: 'n' }, `×${r.count}`)))) : null,
        s.lore.searches.length ? h('table', { style: 'margin-top:10px' }, h('tr', {}, h('th', {}, tr('powers.searches')), h('th', { class: 'n' }, '')), s.lore.searches.map((q) => h('tr', {}, h('td', {}, h('code', {}, q.pattern), q.where ? h('span', { class: 'muted' }, ` · ${q.where}`) : null), h('td', { class: 'n muted' }, q.tool)))) : null);
    },
    shell(s) {
      if (!s.shell.length) return null;
      return h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.command')), h('th', { class: 'n' }, tr('powers.time')), h('th', {}, '')),
        s.shell.map((c) => h('tr', {}, h('td', {}, h('span', { class: c.ok ? 'ok' : 'bad' }, c.ok ? '✓' : '✗')), h('td', {}, h('code', {}, c.command)), h('td', { class: 'n muted' }, dur(c.ms)), h('td', { class: 'n' }, copyBtn(c.command)))));
    },
    test(s) {
      if (!s.test.runs.length) return null;
      const head = h('p', {}, h('span', { class: 'chip sun' }, s.test.streak === 1 ? tr('powers.streak1') : tr('powers.streak', { n: s.test.streak })), ' ', s.test.lastGreenAt ? tr('powers.lastGreen', { t: ago(s.test.lastGreenAt) }) : tr('powers.neverGreen'));
      return h('div', {}, head, h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, tr('powers.run')), h('th', { class: 'n' }, tr('powers.time'))),
        s.test.runs.map((r) => h('tr', {}, h('td', {}, h('span', { class: r.passed === true ? 'ok' : r.passed === false ? 'bad' : 'muted' }, r.passed === true ? '✓' : r.passed === false ? '✗' : '?')), h('td', {}, h('code', {}, r.command), r.summary ? h('div', { class: 'muted' }, r.summary) : null), h('td', { class: 'n muted' }, dur(r.ms))))));
    },
    roam(s) {
      if (!s.roam.length) return null;
      const icon = { page: '🌐', search: '🔎', mcp: '🧩' };
      return h('table', {}, s.roam.map((w) => h('tr', {}, h('td', {}, icon[w.kind] || '•'), h('td', {}, h('code', {}, w.target)), h('td', { class: 'n muted' }, ago(w.at)), h('td', { class: 'n' }, copyBtn(w.target)))));
    },
    swarm(s) {
      if (!s.swarm.length) return null;
      return h('table', {}, h('tr', {}, h('th', {}, tr('powers.agent')), h('th', {}, tr('powers.status')), h('th', { class: 'n' }, tr('powers.time'))),
        s.swarm.map((a) => h('tr', {}, h('td', {}, h('code', {}, a.type)), h('td', {}, a.endedAt ? h('span', { class: 'ok' }, tr('powers.done')) : h('b', {}, tr('powers.running'))), h('td', { class: 'n muted' }, dur((a.endedAt || Date.now()) - a.startedAt)))));
    },
  };

  function renderPanel() {
    const box = $('panel');
    box.textContent = '';
    box.style.setProperty('--c', `var(--${tab})`);
    box.append(h('h2', {}, `${tr(`power.${tab}`)} · ${tr(`power.${tab}.title`)}`), h('p', {}, tr(`power.${tab}.text`)));
    if (!data.unlocked.includes(tab)) {
      box.append(h('div', { class: 'lock' }, h('img', { src: `/art/${tab}-juvenile.svg`, alt: '' }), h('p', {}, h('b', {}, tr('powers.locked', { lineage: tr(`power.${tab}`) }))), h('p', { class: 'muted' }, tr('powers.lockedHow', { work: tr(`work.${tab}`) }))));
      return;
    }
    const s = data.sessions.find((x) => x.id === selected);
    const view = s ? VIEWS[tab](s) : null;
    box.append(view || h('div', { class: 'empty' }, tr('powers.nothing')));
  }

  function render() {
    if (!data) return;
    renderWait();
    renderSessions();
    renderTabs();
    renderPanel();
  }

  let pending = null;
  async function refresh() {
    try {
      data = await (await fetch('/api/powers')).json();
      render();
    } catch {}
  }
  const es = new EventSource('/stream');
  es.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'state') live = msg.live;
    clearTimeout(pending);
    pending = setTimeout(refresh, 300);
  };
  // The waiting timer ticks every second.
  setInterval(() => data && renderWait(), 1000);
  refresh();
</script>
</body>
</html>
