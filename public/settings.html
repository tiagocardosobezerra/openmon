<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon Settings</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding-bottom: 56px; max-width: 900px; }
  /* Sections on the left, one section at a time on the right. */
  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: start; margin-top: 18px; }
  .side { position: sticky; top: 70px; display: grid; gap: 4px; }
  .side button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 1.5px solid transparent; border-radius: var(--r-md); background: transparent; color: var(--muted); font: 600 14px var(--font-display); text-align: left; cursor: pointer; }
  .side button .ico { width: 22px; text-align: center; font-size: 16px; }
  .side button:hover { color: var(--ink); background: var(--surface-2); }
  .side button[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--outline); box-shadow: 0 2px 0 var(--outline); }
  .pane h2 { margin: 0 0 2px; font-size: 20px; }
  .pane > p.lead { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .card { padding: 4px 16px; margin-bottom: 12px; }
  .card h3 { margin: 12px 0 0; font: 600 12px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .card h3 + .row, .card > .row:first-child { border-top: 0; }
  .row b { font: 600 15px var(--font-display); }
  .row small { grid-column: 1; color: var(--muted); font-size: 12.5px; }
  .row .ctl { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; }
  .row.sub { padding-left: 18px; border-left: 3px solid var(--line); }
  .row.wide { grid-template-columns: 1fr; }
  .row.wide .ctl { grid-row: auto; grid-column: 1; justify-content: flex-start; margin-top: 6px; }
  .status { font-size: 12.5px; color: var(--muted); }
  .status.on { color: var(--ok); font-weight: 700; }
  /* A real switch instead of a bare checkbox. */
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--outline); transition: background 0.15s ease; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%; background: #fffdf7; box-shadow: 0 0 0 2px var(--outline); transition: transform 0.15s ease; }
  .switch input:checked + span { background: var(--brand); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { box-shadow: inset 0 0 0 2px var(--outline), var(--focus); }
  .seg.pick { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); }
  .seg.pick button { flex: none; padding: 2px 12px; }
  select, .input { font: 500 14px var(--font-body); }
  select { min-height: 34px; padding: 4px 10px; border: var(--bw) solid var(--outline); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
  .input.topic { width: 220px; min-height: 34px; font-size: 14px; }
  code.url { padding: 4px 8px; border-radius: var(--r-sm); background: var(--surface-2); word-break: break-all; }
  .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
  kbd { margin: 0 2px; }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; display: flex; overflow-x: auto; gap: 6px; }
    .side button { width: auto; white-space: nowrap; }
  }
</style>

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  let desktop = null;
  let cloud = null;
  let cloudCode = null;
  let cloudMsg = '';

  async function save(patch, redraw = false) {
    config = await (await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })).json();
    if (redraw) render();
  }

  // --- building blocks ------------------------------------------------------
  function row(title, sub, control, { html = false, cls = '' } = {}) {
    const r = el('div', `row ${cls}`.trim());
    const small = el('small');
    if (html) small.innerHTML = sub;
    else small.textContent = sub || '';
    const ctl = el('div', 'ctl');
    if (control) ctl.append(...[].concat(control).filter(Boolean));
    r.append(el('b', '', title), ctl, small);
    return r;
  }
  function toggle(key, { invert = false, redraw = false, onChange = null } = {}) {
    const wrap = el('label', 'switch');
    const c = el('input');
    c.type = 'checkbox';
    c.checked = invert ? !config[key] : Boolean(config[key]);
    c.setAttribute('role', 'switch');
    c.onchange = () => (onChange ? onChange(c.checked) : save({ [key]: invert ? !c.checked : c.checked }, redraw));
    wrap.append(c, el('span'));
    return wrap;
  }
  // A few choices side by side (instead of a drop-down).
  function pick(options, current, onPick) {
    const box = el('div', 'seg pick');
    box.setAttribute('role', 'radiogroup');
    for (const [value, label] of options) {
      const b = el('button', '', label);
      b.type = 'button';
      b.setAttribute('aria-selected', String(value === current));
      b.onclick = () => onPick(value);
      box.append(b);
    }
    return box;
  }
  function card(title, rows) {
    const c = el('div', 'card panel soft');
    if (title) c.append(el('h3', '', title));
    c.append(...rows.filter(Boolean));
    return c;
  }
  function btn(label, onClick, cls = 'btn sm') {
    const b = el('button', cls, label);
    b.type = 'button';
    b.onclick = () => onClick(b);
    return b;
  }

  // Your pet on any computer, through your GitHub account.
  async function cloudPost(path, body) {
    return (await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })).json();
  }
  async function refreshCloud() {
    cloud = await (await fetch('/api/cloud')).json();
    if (cloud && cloud.connected) cloudCode = null;
    if (tab === 'computer') render();
  }
  function cloudCard() {
    if (!cloud || cloud.off) return null;
    const rows = [];
    if (!cloud.connected) {
      const signIn = btn(T.cloudIn, async (b) => {
        b.disabled = true;
        cloudMsg = '';
        const r = await cloudPost('/api/cloud/connect', { method: cloud.canDevice ? 'device' : 'gh' });
        if (r.userCode) cloudCode = r;
        else if (!r.ok) cloudMsg = T.cloudErr[r.error] || T.cloudFail;
        await refreshCloud();
      }, 'btn sm primary');
      rows.push(row('', T.cloudSub, signIn, { cls: 'wide' }));
      if (cloudCode) {
        const copy = btn(T.cloudCopy, (b) => navigator.clipboard.writeText(cloudCode.userCode).then(() => (b.textContent = T.cloudCopied)));
        const open = btn(T.cloudOpen, () => window.open(cloudCode.uri, '_blank'), 'btn sm primary');
        rows.push(row(cloudCode.userCode, fill(T.cloudCode, { uri: cloudCode.uri, code: cloudCode.userCode }), [open, copy], { cls: 'wide' }));
      }
    } else {
      const when = cloud.syncedAt ? fill(T.cloudAt, { t: clock(cloud.syncedAt) }) : T.cloudNever;
      const now = btn(T.cloudNow, async (b) => {
        b.disabled = true;
        const r = await cloudPost('/api/cloud/sync');
        cloudMsg = r.action === 'error' ? T.cloudErr[r.error] || T.cloudFail : '';
        await refreshCloud();
      });
      const out = btn(T.cloudOut, async () => {
        await cloudPost('/api/cloud/logout');
        await refreshCloud();
      }, 'btn sm ghost');
      rows.push(row(fill(T.cloudAs, { login: cloud.login }), `${cloud.machine} · ${when}`, [now, out]));
      if (cloud.conflict) {
        const c = cloud.conflict;
        const pick = (use) => async () => {
          await cloudPost('/api/cloud/sync', { use });
          await refreshCloud();
        };
        rows.push(row('', fill(T.cloudConflict, { name: c.nickname || c.name, level: c.level, machine: c.machine || '?' }), [
          btn(T.cloudUseRemote, pick('remote'), 'btn sm primary'),
          btn(T.cloudKeepLocal, pick('local')),
        ], { cls: 'wide' }));
      }
    }
    if (cloudMsg || cloud.error) rows.push(row('', cloudMsg || T.cloudErr[cloud.error] || T.cloudFail, null, { cls: 'wide' }));
    return card(T.cloud, rows);
  }
  // While a sign-in code is on screen, watch for it to finish.
  setInterval(() => {
    if (cloudCode && tab === 'computer') refreshCloud();
  }, 3000);

  // --- sections ------------------------------------------------------------
  const VIEWS = {
    pet() {
      const scale = config.scale || 1;
      const rename = btn(T.rename, () => (desk ? desk.openName() : window.open('/name.html', '_blank', 'width=340,height=170')));
      return [
        card(T.look, [
          row(T.name, pet && pet.nickname ? `${pet.nickname} · ${pet.form}` : T.nameSub, rename),
          row(T.size, '', pick([[0.8, T.small], [1, T.normal], [1.25, T.large]], [0.8, 1, 1.25].find((s) => Math.abs(s - scale) < 0.01), (v) => save({ scale: v }, true))),
          row(T.seasons, T.seasonsSub, toggle('seasons')),
          row(T.language, T.languageSub, pick([['pt-BR', 'Português'], ['en', 'English'], ['es', 'Español']], lang, (v) => save({ lang: v }).then(() => location.replace(`?lang=${v}#${tab}`)))),
        ]),
        card(T.behaviour, [
          row(T.sounds, T.soundsSub, toggle('muted', { invert: true })),
          row(T.chatter, T.chatterSub, toggle('chatter')),
          row(T.stroll, T.strollSub, toggle('stroll')),
          row(T.follow, T.followSub, toggle('followProject')),
        ]),
      ];
    },
    alerts() {
      return [
        card(null, [
          row(T.notify, T.notifySub, toggle('notify')),
          row(T.answerOn, T.answerOnSub, toggle('answerFromPet', { redraw: true })),
          config.answerFromPet ? row(T.wait, T.waitSub, pick([10, 25, 40, 60].map((n) => [n, fill(T.seconds, { n })]), config.answerWaitSec || 25, (v) => save({ answerWaitSec: v }, true)), { cls: 'sub' }) : null,
        ]),
      ];
    },
    focus() {
      const status = (on, until) => el('span', `status${on ? ' on' : ''}`, on ? fill(T.until, { t: clock(until) }) : T.off);
      const timer = (key, on, options) => [status(on, config[`${key}Until`]), ...options.map(([n, label]) => btn(label, () => save({ [`${key}Minutes`]: n }, true))), on ? btn(T.end, () => save({ [`${key}Minutes`]: 0 }, true), 'btn sm ghost') : null];
      const tomorrow = () => {
        const d = new Date();
        d.setHours(24 + 8, 0, 0, 0);
        return Math.ceil((d - Date.now()) / 60000);
      };
      return [
        card(T.now, [
          row(T.focusMode, T.focusModeSub, timer('focus', config.focus, [[25, fill(T.min, { n: 25 })], [50, fill(T.min, { n: 50 })], [90, fill(T.min, { n: 90 })]])),
          row(T.quiet, T.quietSub, timer('quiet', config.quiet, [[30, fill(T.min, { n: 30 })], [60, fill(T.min, { n: 60 })], [tomorrow(), T.tomorrow]])),
        ]),
        card(T.always, [
          row(T.present, T.presentSub, toggle('present')),
          row(T.breaks, T.breaksSub, pick([[0, T.off], [50, fill(T.min, { n: 50 })], [90, fill(T.min, { n: 90 })]], config.breakEvery || 0, (v) => save({ breakEvery: v }, true))),
        ]),
      ];
    },
    phone() {
      const rows = [row(T.phoneOn, T.phoneOnSub, toggle('phoneAlerts', { redraw: true }))];
      if (config.phoneAlerts) {
        const topic = el('input', 'input topic');
        topic.value = config.phoneTopic || '';
        topic.placeholder = 'openmon-…';
        topic.onchange = () => save({ phoneTopic: topic.value.trim() });
        const gen = btn(T.random, () => {
          const bytes = crypto.getRandomValues(new Uint8Array(9));
          topic.value = `openmon-${[...bytes].map((b) => b.toString(36).padStart(2, '0')).join('').slice(0, 14)}`;
          save({ phoneTopic: topic.value });
        });
        const result = el('span');
        const test = btn(T.test, async () => {
          await save({ phoneTopic: topic.value.trim() });
          const r = await (await fetch('/api/phone/test', { method: 'POST' })).json();
          result.className = r.ok ? 'ok' : 'bad';
          result.textContent = r.ok ? T.sent : T.failed;
        }, 'btn sm primary');
        rows.push(
          row(T.topic, T.topicSub, [topic, gen, test, result], { cls: 'sub wide' }),
          row(T.after, T.afterSub, pick([[0, T.immediately], [30, fill(T.seconds, { n: 30 })], [60, fill(T.seconds, { n: 60 })], [180, fill(T.seconds, { n: 180 })]], config.phoneAfterSec ?? 60, (v) => save({ phoneAfterSec: v }, true)), { cls: 'sub' }),
          row(T.project, T.projectSub, toggle('phoneProject'), { cls: 'sub' }),
        );
      }
      return [card(null, rows)];
    },
    computer() {
      if (!desk || !desktop) return [cloudCard(), card(null, [row(T.tabs.computer, T.desktopOnly, null)])].filter(Boolean);
      const login = el('label', 'switch');
      const c = el('input');
      c.type = 'checkbox';
      c.checked = desktop.loginItem;
      c.onchange = () => desk.call('login', c.checked);
      login.append(c, el('span'));
      const claude = desktop.hooked ? el('span', 'status on', T.claudeOk) : btn(T.connect, async () => {
        desktop = await desk.call('connect');
        render();
      }, 'btn sm primary');
      return [
        card(null, [
          row(T.login, T.loginSub, login),
          row(T.claude, T.claudeSub, claude),
          row(T.position, T.positionSub, btn(T.reset, () => desk.call('reset-position'))),
        ]),
        cloudCard(),
        card(T.backups, [
          row('', T.backupsSub, [
            btn(T.copyNow, async (b) => {
              await desk.call('backup');
              b.textContent = T.copied;
            }, 'btn sm primary'),
            btn(T.exportFile, () => desk.call('export')),
            btn(T.importFile, () => desk.call('import')),
            btn(T.openFolder, () => desk.call('open-backups'), 'btn sm ghost'),
          ], { cls: 'wide' }),
        ]),
      ];
    },
    more() {
      const url = `${location.origin}/?scale=1&quiet`;
      const copy = btn(T.copy, (b) => navigator.clipboard.writeText(url).then(() => (b.textContent = T.copiedUrl)));
      return [
        card(null, [
          row(T.keys, T.keysSub, null, { html: true }),
          row(T.obs, T.obsSub, [el('code', 'url', url), copy], { cls: 'wide' }),
          desk ? row(T.demo, T.demoSub, btn(T.play, () => desk.call('demo'))) : null,
        ]),
      ];
    },
  };

  function render() {
    const side = $('side');
    side.textContent = '';
    for (const [id, icon] of SECTIONS) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(id === tab));
      b.append(el('span', 'ico', icon), el('span', '', T.tabs[id]));
      b.onclick = () => {
        tab = id;
        history.replaceState(null, '', `#${id}`);
        render();
      };
      side.append(b);
    }
    const pane = $('pane');
    pane.textContent = '';
    pane.append(el('h2', '', T.tabs[tab]), el('p', 'lead', T.leads[tab]), ...VIEWS[tab]());
  }

  Promise.all([
    fetch('/api/state').then((r) => r.json()),
    desk ? desk.call('info').catch(() => null) : null,
    fetch('/api/cloud').then((r) => r.json()).catch(() => null),
  ]).then(([s, d, c]) => {
    cloud = c;
    config = s.config || {};
    pet = s.pet || null;
    desktop = d;
    render();
  });
  // Focus and quiet count down; keep their times fresh.
  setInterval(() => {
    if (tab !== 'focus') return;
    fetch('/api/state').then((r) => r.json()).then((s) => {
      config = s.config || config;
      render();
    });
  }, 30000);
</script>
</body>
</html>
