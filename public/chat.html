<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Openmon</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body.page { min-height: 0; margin: 0; display: grid; grid-template-columns: 260px 1fr; background: var(--bg); overflow: hidden; }
  aside { display: flex; flex-direction: column; gap: 6px; padding: 12px 10px; border-right: var(--bw) solid var(--line); background: var(--surface-2); overflow: auto; min-height: 0; }
  aside h2 { margin: 12px 6px 2px; font: 600 12px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  aside .item { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; align-items: center; width: 100%; padding: 7px 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
  aside .item:hover { background: var(--surface); }
  aside .item[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--outline); }
  aside .item b { font: 600 13.5px var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .item small { grid-column: 2; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.working { background: var(--brand); animation: pulse 1.2s ease-in-out infinite; }
  .dot.waiting, .dot.attention { background: var(--sun); box-shadow: 0 0 0 1.5px var(--outline); }
  .dot.done { background: var(--ok); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.working, .msg.assistant.live::after { animation: none; } }
  aside .empty { margin: 2px 8px; color: var(--muted); font-size: 12.5px; }
  aside .grow { flex: 1; }
  main.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header.head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: var(--bw) solid var(--line); background: var(--surface); }
  header.head .t { flex: 1; min-width: 0; }
  header.head h1 { margin: 0; font: 600 16px var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.head p { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log { flex: 1; overflow: auto; padding: 16px clamp(12px, 4vw, 40px) 8px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(760px, 92%); padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant.live::after { content: "▍"; color: var(--brand); animation: pulse 1s infinite; }
  .msg.thinking::after { content: "● ● ●"; letter-spacing: 2px; }
  .msg.tool { align-self: flex-start; padding: 2px 10px; background: transparent; color: var(--muted); font: 500 12.5px var(--font-mono); }
  .msg.tool::before { content: "› "; }
  .msg.error { align-self: stretch; max-width: none; background: var(--bad-soft); color: var(--bad); border: 1.5px solid color-mix(in srgb, var(--bad) 40%, transparent); font-size: 13.5px; white-space: pre-wrap; }
  .msg.notice { align-self: center; color: var(--muted); font-size: 12.5px; padding: 2px 8px; }
  .msg .img { display: inline-block; margin-top: 4px; font-size: 12px; opacity: 0.85; }
  .msg .via { display: block; margin-top: 4px; font-size: 11.5px; opacity: 0.8; white-space: normal; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg h3 { margin: 8px 0 4px; font: 600 15px var(--font-display); }
  .msg code { font: 500 13px var(--font-mono); background: var(--sunken); padding: 1px 5px; border-radius: 5px; }
  .msg pre { margin: 6px 0 8px; padding: 10px 12px; background: var(--sunken); border-radius: var(--r-sm); overflow: auto; }
  .msg pre code { padding: 0; background: none; white-space: pre; display: block; }
  .msg a { color: var(--brand-ink); }
  .card { align-self: stretch; max-width: 760px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: var(--bw) solid var(--outline); box-shadow: var(--lift-sm); }
  .card.danger { border-color: var(--bad); }
  .card .k { font: 600 12px var(--font-display); color: var(--muted); }
  .card h3 { margin: 2px 0 6px; font: 600 15px var(--font-display); }
  .card .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .card .diff { margin: 6px 0 0; padding: 6px 0; background: var(--sunken); border-radius: var(--r-sm); max-height: 180px; overflow: auto; }
  .card .diff code { display: block; padding: 0 10px; font: 500 12.5px/1.45 var(--font-mono); white-space: pre; }
  .card .diff .del { background: color-mix(in srgb, #e5484d 20%, transparent); }
  .card .diff .add { background: color-mix(in srgb, #3fb8a6 22%, transparent); }
  .composer { padding: 8px clamp(12px, 4vw, 40px) 14px; border-top: var(--bw) solid var(--line); background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
  .chips .chip { white-space: nowrap; }
  .box { display: flex; align-items: flex-end; gap: 8px; }
  .box textarea { flex: 1; min-height: 44px; max-height: 40vh; resize: none; font: 14.5px/1.45 var(--font-body); }
  .attached { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .attached .chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 0 0 4px; font: inherit; }
  .newbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .newbar select { max-width: 340px; }
  .welcome { margin: auto; max-width: 520px; text-align: center; color: var(--muted); }
  .welcome h2 { color: var(--ink); font: 600 22px var(--font-display); margin: 0 0 6px; }
  .welcome img { width: 96px; height: 96px; object-fit: contain; }
  header.head .me { width: 34px; height: 34px; object-fit: contain; }
  .drop { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 18%, transparent); border: 3px dashed var(--brand); font: 600 20px var(--font-display); color: var(--brand-ink); pointer-events: none; }
  dialog { border: var(--bw) solid var(--outline); border-radius: var(--r-lg); background: var(--surface); color: var(--ink); padding: 16px 18px; width: min(560px, 92vw); box-shadow: var(--lift); }
  dialog::backdrop { background: rgba(20, 12, 30, 0.45); }
  dialog h2 { margin: 0 0 4px; font: 600 18px var(--font-display); }
  dialog p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  dialog .rows { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; max-height: 50vh; overflow: auto; }
  dialog .rowline { display: flex; gap: 6px; align-items: center; }
  dialog .rowline .input { flex: 1; min-width: 0; }
  dialog textarea.input { width: 100%; box-sizing: border-box; min-height: 260px; font: 13px/1.5 var(--font-mono); }
  dialog .end { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  .sched li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .sched li span { flex: 1; min-width: 0; }
  .sched li small { color: var(--muted); }
  .sched { list-style: none; margin: 0 0 10px; padding: 0; }
  .menu-btn { display: none; }
  /* The tools of one answer, folded into one line. */
  details.steps { align-self: flex-start; max-width: min(760px, 92%); color: var(--muted); font: 500 12.5px var(--font-mono); }
  details.steps > summary { cursor: pointer; list-style: none; padding: 2px 8px; border-radius: 6px; }
  details.steps > summary::-webkit-details-marker { display: none; }
  details.steps > summary::before { content: "› "; }
  details.steps[open] > summary::before { content: "⌄ "; }
  details.steps > summary:hover { background: var(--surface-2); color: var(--ink); }
  details.steps div { padding: 1px 8px 1px 22px; }
  /* Code: a copy button, and a few colours. */
  .msg pre { position: relative; }
  .msg pre .copy { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 6px; padding: 2px 8px; background: var(--surface); color: var(--muted); font: 600 11.5px var(--font-body); cursor: pointer; opacity: 0; }
  .msg pre:hover .copy, .msg pre .copy:focus-visible { opacity: 1; }
  /* At least 4.5:1 on the code background, in both themes. */
  .tk-c { color: #56616d; font-style: italic; } .tk-s { color: #1c6e3c; } .tk-n { color: #a8360a; } .tk-k { color: #5a49d6; font-weight: 600; }
  :root[data-theme="dark"] .tk-c { color: #9aa5b1; } :root[data-theme="dark"] .tk-s { color: #7ee2a0; } :root[data-theme="dark"] .tk-n { color: #ffb37a; } :root[data-theme="dark"] .tk-k { color: #b9adff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tk-c { color: #9aa5b1; } :root:not([data-theme="light"]) .tk-s { color: #7ee2a0; } :root:not([data-theme="light"]) .tk-n { color: #ffb37a; } :root:not([data-theme="light"]) .tk-k { color: #b9adff; } }
  /* Days, and what it is doing now. */
  .day { align-self: center; margin: 6px 0 2px; padding: 1px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font: 600 11.5px var(--font-display); }
  .doing { align-self: flex-start; color: var(--muted); font: 500 12.5px var(--font-mono); padding: 0 8px; }
  /* Attached pictures, seen before they go. */
  .attached .thumb { position: relative; }
  .attached .thumb img { height: 54px; max-width: 96px; object-fit: cover; border-radius: 8px; box-shadow: 0 0 0 1.5px var(--line); display: block; }
  .attached .thumb button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--outline); color: #fff; font-size: 11px; cursor: pointer; }
  aside .group { margin: 8px 8px 2px; color: var(--muted); font: 600 11px var(--font-display); }
  aside .item { border-left: 3px solid var(--hue, transparent); }
  :focus-visible { outline: none; box-shadow: var(--focus); }
  #search { margin-top: 6px; font-size: 13px; }
  .sm-select { width: auto; min-height: 28px; padding: 2px 8px; font-size: 12.5px; }
  .msg-actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity 0.15s; }
  .msg.assistant:hover .msg-actions, .msg.assistant:focus-within .msg-actions { opacity: 1; }
  .msg-actions button { border: 0; background: none; color: var(--muted); font: 12px var(--font-body); padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .msg-actions button:hover { background: var(--surface-2); color: var(--ink); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
  @media (max-width: 720px) {
    body.page { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 30% 0 0; z-index: 5; display: none; box-shadow: var(--lift); }
    body.side aside { display: flex; }
    .menu-btn { display: inline-grid; }
  }
</style>
</head>
<body class="page">
<aside id="side">
  <button class="btn primary" id="new" type="button"></button>
  <input class="input" id="search" type="search">
  <h2 id="h-chats"></h2>
  <div id="chats"></div>
  <h2 id="h-agents"></h2>
  <div id="agents"></div>
  <div class="grow"></div>
  <button class="btn quiet sm" id="open-sched" type="button"></button>
  <button class="btn quiet sm" id="open-memory" type="button"></button>
</aside>
<main class="chat">
  <header class="head">
    <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Menu">☰</button>
    <img class="me" id="me" alt="" hidden>
    <div class="t"><h1 id="title"></h1><p id="sub"></p></div>
    <select class="input sm-select" id="model" hidden></select>
    <button class="icon-btn" id="pin" type="button" hidden></button>
    <button class="btn sm" id="stop" type="button" hidden></button>
    <button class="btn sm quiet" id="continue" type="button" hidden></button>
    <button class="btn sm ghost" id="rename" type="button" hidden></button>
    <button class="btn sm ghost" id="export" type="button" hidden></button>
    <button class="btn sm ghost" id="delete" type="button" hidden></button>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="composer">
    <div class="newbar" id="newbar" hidden>
      <span id="in-folder"></span>
      <select class="input" id="folder"></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="attached" id="attached"></div>
    <div class="box">
      <button class="icon-btn" id="attach" type="button"></button>
      <button class="icon-btn" id="paste" type="button"></button>
      <button class="icon-btn" id="shot" type="button"></button>
      <textarea class="input" id="text" rows="1"></textarea>
      <button class="btn primary" id="send" type="button"></button>
    </div>
  </div>
</main>
<div class="drop" id="drop" hidden></div>

<dialog id="ask">
  <h2 id="ask-title"></h2>
  <input class="input" id="ask-text" style="width: 100%; box-sizing: border-box">
  <div class="end"><button class="btn" id="ask-cancel" type="button"></button><button class="btn primary" id="ask-ok" type="button">OK</button></div>
</dialog>
<dialog id="memory">
  <h2 id="m-title"></h2>
  <p id="m-sub"></p>
  <textarea class="input" id="m-text"></textarea>
  <div class="end"><button class="btn" id="m-cancel" type="button"></button><button class="btn primary" id="m-save" type="button"></button></div>
</dialog>
<dialog id="actions">
  <h2 id="a-title"></h2>
  <p id="a-sub"></p>
  <div class="rows" id="a-rows"></div>
  <div class="end"><button class="btn quiet" id="a-reset" type="button"></button><button class="btn" id="a-add" type="button"></button><button class="btn" id="a-cancel" type="button"></button><button class="btn primary" id="a-save" type="button"></button></div>
</dialog>
<dialog id="sched">
  <h2 id="s-title"></h2>
  <p id="s-sub"></p>
  <ul class="sched" id="s-list"></ul>
  <div class="rows">
    <label><span id="s-kind-l"></span><select class="input" id="s-kind"></select></label>
    <label><span id="s-text-l"></span><textarea class="input" id="s-text" rows="2" style="min-height: 0"></textarea></label>
    <label><span id="s-when-l"></span>
      <span class="rowline"><select class="input" id="s-when"></select><input class="input" id="s-min" type="number" min="1" max="1440" value="30"><input class="input" id="s-time" type="time" value="09:00"></span>
    </label>
    <label id="s-folder-l"><span id="s-folder-t"></span><select class="input" id="s-folder"></select></label>
  </div>
  <div class="row presets" id="s-presets"></div>
  <p id="s-status"></p>
  <div class="end"><button class="btn" id="s-close" type="button"></button><button class="btn primary" id="s-add" type="button"></button></div>
</dialog>

<script src="i18n.js"></script>

  // ---- A light Markdown: paragraphs, lists, headings, code, bold, links.
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  const KEYWORDS = new Set('const let var function return if else for while do switch case break continue new class extends import from export default async await try catch finally throw typeof instanceof in of null undefined true false this def elif lambda pass yield with as None True False self print fn pub mut impl struct enum match use mod package func go defer type interface public private static void int string bool select where insert update delete create table and or not'.split(' '));
  function highlight(code) {
    const re = /(\/\/[^\n]*|(?<=^|\s)#\s[^\n]*|(?<=^|\s)#$|\/\*[\s\S]*?\*\/|(?<=^|\s)--\s[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
    let out = '';
    let at = 0;
    for (const m of code.matchAll(re)) {
      out += esc(code.slice(at, m.index));
      const [all, comment, str, num, word] = m;
      if (comment) out += `<span class="tk-c">${esc(all)}</span>`;
      else if (str) out += `<span class="tk-s">${esc(all)}</span>`;
      else if (num) out += `<span class="tk-n">${esc(all)}</span>`;
      else if (word && KEYWORDS.has(word)) out += `<span class="tk-k">${esc(all)}</span>`;
      else out += esc(all);
      at = m.index + all.length;
    }
    return out + esc(code.slice(at));
  }
  function markdown(text) {
    const out = [];
    const parts = String(text).split(/```[^\n]*\n?/);
    parts.forEach((part, i) => {
      if (i % 2) return out.push(`<pre><code>${highlight(part.replace(/\n$/, ''))}</code></pre>`);
      let list = null;
      const flush = () => {
        if (list) out.push(`<${list.tag}>${list.items.map((x) => `<li>${inline(x)}</li>`).join('')}</${list.tag}>`);
        list = null;
      };
      for (const block of part.split(/\n{2,}/)) {
        for (const line of block.split('\n')) {
          const ul = /^\s*[-*•]\s+(.*)$/.exec(line);
          const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
          const h = /^#{1,4}\s+(.*)$/.exec(line);
          if (ul || ol) {
            const tag = ul ? 'ul' : 'ol';
            if (!list || list.tag !== tag) {
              flush();
              list = { tag, items: [] };
            }
            list.items.push((ul || ol)[1]);
          } else if (h) {
            flush();
            out.push(`<h3>${inline(h[1])}</h3>`);
          } else if (line.trim()) {
            flush();
            out.push(`<p>${inline(line)}</p>`);
          }
        }
        flush();
      }
    });
    return out.join('');
  }

  function stepsNode(run, open) {
    const n = (re) => run.filter((m) => re.test(m.tool || m.text)).length;
    const edit = n(/^(Edit|MultiEdit|Write|NotebookEdit)\b/);
    const read = n(/^(Read|Grep|Glob|LS)\b/);
    const exec = n(/^(Bash|PowerShell)\b/);
    const bits = [edit && fill(T.stepsEdit, { n: edit }), read && fill(T.stepsRead, { n: read }), exec && fill(T.stepsRun, { n: exec })].filter(Boolean);
    if (run.length === 1) return el('div', 'msg tool', run[0].text);
    const d = el('details', 'steps');
    d.open = open;
    d.append(el('summary', '', [fill(T.steps, { n: run.length }), ...bits].join(' · ')));
    for (const m of run) d.append(el('div', '', m.text));
    return d;
  }

  function addCopy(pre) {
    if (pre.querySelector('.copy')) return;
    const b = el('button', 'copy', T.copy);
    b.type = 'button';
    b.onclick = async () => {
      const ok = await (desk && desk.copyText ? desk.copyText(pre.querySelector('code').textContent) : navigator.clipboard.writeText(pre.querySelector('code').textContent).then(() => true)).catch(() => false);
      b.textContent = ok ? T.copied : T.copy;
      setTimeout(() => (b.textContent = T.copy), 1500);
    };
    pre.append(b);
  }

  function msgNode(m) {
    if (m.role === 'assistant') {
      const d = el('div', 'msg assistant');
      d.innerHTML = markdown(m.text);
      if (m.at) d.title = new Date(m.at).toLocaleString();
      const actions = el('div', 'msg-actions');
      const act = (label, fn) => {
        const b = el('button', '', label);
        b.type = 'button';
        b.onclick = fn;
        actions.append(b);
      };
      act(`🔊 ${T.listen}`, () => speakText(m.text));
      if (view.kind === 'chat') {
        act(`🧠 ${T.remember}`, async () => {
          const fact = await ask(T.rememberAsk, m.text.replace(/\s+/g, ' ').slice(0, 300));
          if (fact && fact.trim() && (await api('/api/assistant/memory/add', { fact }))) flash(T.remembered);
        });
      }
      d.append(actions);
      return d;
    }
    if (m.role === 'error') {
      const head = { missing: T.missing, login: T.login, turn: T.turn, busy: T.busy, limit: T.limit, api: T.apiError }[m.code] || T.exit;
      return el('div', 'msg error', ['missing', 'login', 'busy', 'limit'].includes(m.code) ? head : `${head}\n${m.text || ''}`);
    }
    const d = el('div', `msg ${m.role === 'user' ? 'user' : m.role === 'tool' ? 'tool' : 'notice'}`, m.text || '');
    if (m.at) d.title = new Date(m.at).toLocaleString();
    if (m.images) d.append(el('span', 'img', ` 🖼 ${m.images} ${T.image}`));
    if (m.via === 'pet') d.append(el('span', 'via', T.viaPet));
    return d;
  }

  function cards() {
    if (!state || !current) return [];
    const mine = (x) => (view.kind === 'chat' ? x.chat === current.id : x.session === current.session);
    const out = [];
    for (const p of state.permissions || []) {
      if (!mine(p)) continue;
      const c = el('div', `card${/rm -rf|--force|reset --hard|DROP TABLE|\| *sh\b/i.test(p.detail || '') ? ' danger' : ''}`);
      c.append(el('div', 'k', T.wants), el('h3', '', trDetail(p.detail) || ''));
      if (p.preview) {
        const pre = el('pre', 'diff');
        for (const l of p.preview.lines) pre.append(el('code', l.t === '-' ? 'del' : 'add', `${l.t} ${l.s}`));
        c.append(pre);
      }
      const row = el('div', 'row');
      const btn = (label, cls, fn) => {
        const b = el('button', `btn sm ${cls}`, label);
        b.type = 'button';
        b.onclick = fn;
        row.append(b);
      };
      const decide = (decision) => fetch('/api/permission/decide', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id, decision }) });
      btn(T.allow, 'primary', () => decide('allow'));
      if (p.canAlways) btn(T.always, '', () => decide('always'));
      btn(T.deny, '', () => decide('deny'));
      if (p.preview && desk && desk.call) btn(T.seeAll, 'quiet', () => desk.call('open-request', p.id));
      c.append(row);
      out.push(c);
    }
    for (const q of state.questions || []) {
      if (!mine(q)) continue;
      const picks = (questionPicks[q.id] = questionPicks[q.id] || []);
      const submit = () => {
        if (q.list.every((_, j) => picks[j])) api('/api/question/answer', { id: q.id, answers: picks.map((x) => [x]) });
        else render();
      };
      for (const [i, item] of q.list.entries()) {
        const c = el('div', 'card');
        c.append(el('div', 'k', `${T.question}${item.header ? ` · ${item.header}` : ''}`), el('h3', '', item.question));
        const row = el('div', 'row');
        for (const o of item.options) {
          const b = el('button', `btn sm${picks[i] === o.label ? ' primary' : ''}`, o.shown || o.label);
          b.type = 'button';
          b.title = o.description || '';
          b.onclick = () => {
            picks[i] = o.label;
            submit();
          };
          row.append(b);
        }
        const other = el('button', 'btn sm quiet', T.other);
        other.type = 'button';
        other.onclick = async () => {
          const t = await ask(T.otherAsk);
          if (t && t.trim()) {
            picks[i] = t.trim();
            submit();
          }
        };
        row.append(other);
        c.append(row);
        out.push(c);
      }
    }
    return out;
  }

  function render() {
    const log = $('log');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    log.textContent = '';
    const isChat = view.kind === 'chat' && current;
    const isAgent = view.kind === 'agent' && current;
    $('newbar').hidden = view.kind !== 'new';
    $('stop').hidden = !(isChat && current.status !== 'idle');
    // Only Claude Code can pick a conversation up here (--resume), and only with its folder.
    $('continue').hidden = !(isAgent && current.agent === 'claude' && current.cwd);
    $('rename').hidden = !isChat;
    $('delete').hidden = !isChat;
    $('export').hidden = !isChat;
    $('model').hidden = !isChat;
    $('pin').hidden = !isChat;
    $('shot').hidden = Boolean(isAgent);
    if (isChat) {
      $('model').value = current.model || '';
      $('pin').textContent = current.pinned ? '📌' : '📍';
      $('pin').title = current.pinned ? T.unpin : T.pin;
      $('pin').setAttribute('aria-label', $('pin').title);
    }
    $('attach').hidden = isAgent;
    $('paste').hidden = false;
    $('text').disabled = false;
    $('send').disabled = false;
    $('chips').hidden = false;
    if (view.kind === 'new' || !current) {
      $('title').textContent = T.newChat;
      $('sub').textContent = '';
      const w = el('div', 'welcome');
      if (petArt) w.append(Object.assign(el('img'), { src: petArt, alt: '' }));
      w.append(el('h2', '', T.welcome), el('p', '', T.welcomeSub));
      log.append(w);
      renderFolders();
      $('text').placeholder = T.placeholder;
      return;
    }
    if (isChat) {
      $('title').textContent = current.title;
      const st = current.status === 'working' ? T.working : current.status === 'waiting' ? T.waiting : T.idle;
      $('sub').title = current.cwd;
      $('sub').textContent = [st, fill(T.in, { dir: current.cwd.split(/[\\/]/).pop() }), current.plan ? T.plan : current.costUsd ? fill(T.cost, { usd: `$${current.costUsd.toFixed(current.costUsd < 1 ? 3 : 2)}` }) : ''].filter(Boolean).join(' · ');
      $('text').placeholder = T.placeholder;
    } else {
      $('title').textContent = current.label;
      $('sub').title = current.cwd || '';
      $('sub').textContent = [current.state === 'working' ? T.working : current.state === 'attention' ? T.waiting : current.state === 'ended' ? T.ended : T.idle, current.cwd ? fill(T.in, { dir: current.cwd.split(/[\\/]/).pop() }) : ''].filter(Boolean).join(' · ');
      $('text').placeholder = current.canSend ? T.placeholderAgent : T.cantWrite;
    }
    // A conversation elsewhere that cannot hear Openmon: "Continue here" instead.
    const mute = Boolean(isAgent && !current.canSend);
    $('text').disabled = mute;
    $('send').disabled = mute;
    $('chips').hidden = mute;
    if (list.present || current.present) {
      log.append(el('div', 'msg notice', T.present));
      return;
    }
    const msgs = current.messages || [];
    let lastDay = null;
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      const day = m.at ? new Date(m.at).toDateString() : lastDay;
      if (day && day !== lastDay && m.at) log.append(el('div', 'day', dayLabel(m.at)));
      lastDay = day;
      if (m.role === 'tool') {
        // The tools in a row: one line that opens.
        const run = [];
        while (i < msgs.length && msgs[i].role === 'tool') run.push(msgs[i++]);
        i--;
        const working = isChat && current.status !== 'idle' && i === msgs.length - 1;
        log.append(stepsNode(run, working));
        continue;
      }
      log.append(msgNode(m));
    }
    if (draft) {
      const d = el('div', 'msg assistant live');
      d.innerHTML = markdown(draft);
      log.append(d);
    } else if (isChat && current.status === 'working') {
      log.append(el('div', 'msg assistant live thinking', ''));
      const a = current.activity;
      if (a) log.append(el('div', 'doing', a.kind === 'tool' ? a.text : a.kind === 'waking' ? T.waking : T.thinking));
    }
    for (const pre of log.querySelectorAll('.msg pre')) addCopy(pre);
    for (const c of cards()) log.append(c);
    // A message to a conversation elsewhere that has not reached it yet.
    if (isAgent && current.queued) {
      const n = el('div', 'msg notice', `${T.queuedNote} `);
      const drop = el('button', 'btn sm quiet', T.discard);
      drop.type = 'button';
      drop.onclick = async () => {
        await api('/api/inbox/cancel', { session: view.session });
        current.queued = false;
        render();
      };
      n.append(drop);
      log.append(n);
    }
    if (atBottom || !render.once) log.scrollTop = log.scrollHeight;
    render.once = true;
  }

  // Read an answer aloud with the computer's own voices.
  function speakText(text) {
    if (!window.speechSynthesis) return;
    const plain = String(text).replace(/```[\s\S]*?```/g, ' ').replace(/[*_`#>]/g, '').slice(0, 1500);
    const u = new SpeechSynthesisUtterance(plain);
    u.lang = lang;
    const voice = speechSynthesis.getVoices().find((v) => v.lang.toLowerCase().startsWith(lang.toLowerCase().slice(0, 2)));
    if (voice) u.voice = voice;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // ---- Quick actions
  function quickActions() {
    const own = Array.isArray(config.quickActions) ? config.quickActions.map((a) => [a.label, a.prompt]) : null;
    return own || T.quick;
  }
  function renderChips() {
    const box = $('chips');
    box.textContent = '';
    for (const [label, text] of quickActions()) {
      const b = el('button', 'chip', label);
      b.type = 'button';
      b.onclick = () => useAction(text);
      box.append(b);
    }
    const edit = el('button', 'chip', '✎');
    edit.type = 'button';
    edit.title = T.actions;
    edit.setAttribute('aria-label', T.actions);
    edit.onclick = openActions;
    box.append(edit);
  }
  async function useAction(text) {
    let t = text;
    if (t.includes('{clipboard}')) {
      const clip = desk && desk.call ? await desk.call('clipboard').catch(() => null) : null;
      t = t.replace('{clipboard}', (clip && clip.text) || '');
      if (clip && clip.image) images.push(clip.image);
      renderAttached();
    }
    if (/[:…]\s*$/.test(t)) {
      $('text').value = `${t} `;
      $('text').focus();
      grow();
      return;
    }
    $('text').value = t;
    send();
  }

  function openActions() {
    const rows = $('a-rows');
    rows.textContent = '';
    const addRow = (label = '', prompt = '') => {
      const r = el('div', 'rowline');
      const l = Object.assign(el('input', 'input'), { value: label, placeholder: T.label, maxLength: 40 });
      l.style.maxWidth = '160px';
      const p = Object.assign(el('input', 'input'), { value: prompt, placeholder: T.prompt, maxLength: 2000 });
      const x = el('button', 'icon-btn', '✕');
      x.type = 'button';
      x.setAttribute('aria-label', T.remove);
      x.onclick = () => r.remove();
      r.append(l, p, x);
      rows.append(r);
    };
    for (const [l, p] of quickActions()) addRow(l, p);
    $('a-add').onclick = () => addRow();
    $('a-reset').onclick = async () => {
      config = (await api('/api/assistant/config', { quickActions: null })) || config;
      $('actions').close();
      renderChips();
    };
    $('a-save').onclick = async () => {
      const quick = [...rows.children].map((r) => ({ label: r.children[0].value, prompt: r.children[1].value })).filter((a) => a.label.trim() && a.prompt.trim());
      config = (await api('/api/assistant/config', { quickActions: quick })) || config;
      $('actions').close();
      renderChips();
    };
    $('actions').showModal();
  }
  $('a-title').textContent = T.actions;
  $('a-sub').textContent = T.actionsSub;
  $('a-add').textContent = T.add;
  $('a-save').textContent = T.save;
  $('a-cancel').textContent = T.cancel;
  $('a-reset').textContent = T.reset;
  $('a-cancel').onclick = () => $('actions').close();

  // ---- Attachments
  function renderAttached() {
    const box = $('attached');
    box.textContent = '';
    const chip = (label, drop) => {
      const c = el('span', 'chip', label);
      const x = el('button', '', '✕');
      x.type = 'button';
      x.setAttribute('aria-label', T.remove);
      x.onclick = () => {
        drop();
        renderAttached();
      };
      c.append(x);
      box.append(c);
    };
    files.forEach((f, i) => chip(`📎 ${f.name}`, () => files.splice(i, 1)));
    images.forEach((img, i) => {
      const t = el('span', 'thumb');
      t.append(Object.assign(el('img'), { src: `data:${img.type};base64,${img.data}`, alt: `${T.image} ${i + 1}` }));
      const x = el('button', '', '✕');
      x.type = 'button';
      x.setAttribute('aria-label', T.remove);
      x.onclick = () => {
        images.splice(i, 1);
        renderAttached();
      };
      t.append(x);
      box.append(t);
    });
  }
  function addPaths(paths) {
    for (const p of paths || []) if (p && !files.some((f) => f.path === p)) files.push({ path: p, name: p.split(/[\\/]/).pop() });
    renderAttached();
  }
  $('attach').onclick = async () => addPaths(desk && desk.call ? await desk.call('pick-files').catch(() => []) : []);
  $('paste').onclick = async () => {
    const clip = desk && desk.call ? await desk.call('clipboard').catch(() => null) : null;
    if (!clip) return;
    if (clip.image) images.push(clip.image);
    if (clip.text) {
      const t = $('text');
      t.value = t.value ? `${t.value}\n${clip.text}` : clip.text;
      grow();
    }
    renderAttached();
    $('text').focus();
  };
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    if (view.kind !== 'agent') $('drop').hidden = false;
  });
  window.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) $('drop').hidden = true;
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    $('drop').hidden = true;
    if (view.kind === 'agent' || !desk || !desk.filePath) return;
    addPaths([...e.dataTransfer.files].map((f) => desk.filePath(f)).filter(Boolean));
  });
  window.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData ? e.clipboardData.items : [])].find((i) => i.type.startsWith('image/'));
    if (!item) return;
    e.preventDefault();
    const reader = new FileReader();
    reader.onload = () => {
      images.push({ type: item.type, data: String(reader.result).split(',')[1] });
      renderAttached();
    };
    reader.readAsDataURL(item.getAsFile());
  });

  // ---- Sending
  function grow() {
    const t = $('text');
    t.style.height = 'auto';
    t.style.height = `${Math.min(t.scrollHeight, window.innerHeight * 0.4)}px`;
  }
  $('text').addEventListener('input', grow);
  $('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
    // ↑ in an empty box: your last message, to send again or change.
    if (e.key === 'ArrowUp' && !$('text').value && current && current.messages) {
      const mine = [...current.messages].reverse().find((m) => m.role === 'user' && m.text);
      if (mine) {
        e.preventDefault();
        $('text').value = mine.text;
        grow();
      }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (document.querySelector('dialog[open]')) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      go({ kind: 'new' });
    } else if (mod && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      $('search').focus();
      $('search').select();
    } else if (e.key === 'Escape' && view.kind === 'chat' && current && current.status !== 'idle') {
      e.preventDefault();
      api('/api/chat/stop', { id: view.id });
    }
  });
  $('text').title = T.keys;

  async function send() {
    const text = $('text').value.trim();
    if (!text && !files.length && !images.length) return;
    $('send').disabled = true;
    const payload = { text, files: files.map((f) => f.path), images };
    let r = null;
    if (view.kind === 'new') {
      const cwd = $('folder').value && $('folder').value !== '__pick' ? $('folder').value : '';
      r = await api('/api/chat/new', { ...payload, cwd });
      if (r && r.id) go({ kind: 'chat', id: r.id });
    } else if (view.kind === 'chat') {
      r = await api('/api/chat/send', { ...payload, id: view.id });
    } else if (view.kind === 'agent') {
      if (!current || !current.canSend) {
        $('send').disabled = false;
        return;
      }
      r = await api('/api/inbox/send', { session: view.session, text });
      if (r && r.ok) {
        current.messages = [...(current.messages || []), { role: 'user', text, via: 'pet' }];
        render();
        flash(r.delivered ? T.sent : T.queued);
      }
    }
    $('send').disabled = false;
    if (!r || r.ok === false) {
      if (r && r.id) go({ kind: 'chat', id: r.id });
      return flash(T.notSent);
    }
    $('text').value = '';
    files = [];
    images = [];
    renderAttached();
    grow();
    refreshList();
  }
  $('send').onclick = send;
  function flash(text) {
    $('sub').textContent = text;
  }

  // ---- Header buttons
  $('stop').onclick = () => api('/api/chat/stop', { id: view.id });
  $('continue').onclick = async () => {
    const r = await api('/api/chat/continue', { session: view.session });
    if (r && r.id) go({ kind: 'chat', id: r.id });
  };
  $('rename').onclick = async () => {
    const t = await ask(T.renameAsk, current ? current.title : '');
    if (t && t.trim()) {
      await api('/api/chat/rename', { id: view.id, title: t });
      await refreshList();
      load();
    }
  };
  $('delete').onclick = async () => {
    if (!confirm(T.delAsk)) return;
    await api('/api/chat/delete', { id: view.id });
    await refreshList();
    go({ kind: 'new' });
  };
  $('new').onclick = () => go({ kind: 'new' });
  let searchTimer = 0;
  $('search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      const q = $('search').value.trim();
      if (!q) searchHits = null;
      else {
        const r = await api(`/api/chats?q=${encodeURIComponent(q)}`);
        searchHits = r ? r.hits || [] : [];
      }
      renderSide();
    }, 250);
  });
  $('model').onchange = async () => {
    await api('/api/chat/model', { id: view.id, model: $('model').value || null });
    refreshList();
  };
  $('pin').onclick = async () => {
    await api('/api/chat/pin', { id: view.id, pinned: !(current && current.pinned) });
    await refreshList();
    load();
  };
  $('export').onclick = async () => {
    const r = await api(`/api/chat/markdown?id=${encodeURIComponent(view.id)}`);
    if (r && r.markdown && desk && desk.call && (await desk.call('save-markdown', { name: current.title, text: r.markdown }).catch(() => false))) flash(T.exported);
  };
  $('shot').onclick = async () => {
    const shot = desk && desk.call ? await desk.call('screenshot').catch(() => null) : null;
    if (shot) {
      images.push(shot);
      renderAttached();
    }
  };
  $('menu').onclick = () => document.body.classList.toggle('side');

  // ---- Memory
  $('m-title').textContent = T.memory;
  $('m-sub').textContent = T.memorySub;
  $('m-save').textContent = T.save;
  $('m-cancel').textContent = T.cancel;
  $('m-cancel').onclick = () => $('memory').close();
  $('open-memory').onclick = async () => {
    const m = await api('/api/assistant/memory');
    $('m-text').value = (m && m.text) || '';
    $('m-sub').textContent = `${T.memorySub} (${(m && m.path) || ''})`;
    $('memory').showModal();
  };
  $('m-save').onclick = async () => {
    const r = await api('/api/assistant/memory', { text: $('m-text').value });
    if (r && r.ok) $('memory').close();
  };

  // ---- Reminders and tasks
  $('s-title').textContent = T.schedule;
  $('s-sub').textContent = T.scheduleSub;
  $('s-kind-l').textContent = T.kind;
  $('s-text-l').textContent = T.textL;
  $('s-when-l').textContent = T.when;
  $('s-folder-t').textContent = T.folderL;
  $('s-close').textContent = T.close;
  $('s-add').textContent = T.schedAdd;
  for (const [v, l] of [['remind', T.remind], ['task', T.task]]) $('s-kind').append(Object.assign(el('option', '', l), { value: v }));
  for (const [v, l] of [['in', T.inMin], ['at', T.at], ['daily', T.daily], ['weekdays', T.weekdays]]) $('s-when').append(Object.assign(el('option', '', l), { value: v }));
  function schedForm() {
    const task = $('s-kind').value === 'task';
    $('s-folder-l').hidden = !task;
    const inMin = $('s-when').value === 'in';
    $('s-min').hidden = !inMin;
    $('s-time').hidden = inMin;
  }
  $('s-kind').onchange = schedForm;
  $('s-when').onchange = schedForm;
  async function renderSched() {
    const r = await api('/api/schedule');
    const ul = $('s-list');
    ul.textContent = '';
    const items = (r && r.items) || [];
    if (!items.length) ul.append(el('li', '', T.schedNone));
    for (const i of items) {
      const li = el('li');
      const s = el('span', '', `${i.kind === 'task' ? '🤖' : '⏰'} ${i.text}`);
      s.append(el('br'), el('small', '', fill(T.next, { t: new Date(i.next).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) }) + (i.repeat ? ` · ${i.repeat === 'daily' ? T.daily : T.weekdays} ${i.time}` : '')));
      const x = el('button', 'btn sm quiet', T.remove);
      x.type = 'button';
      x.onclick = async () => {
        await api('/api/schedule/remove', { id: i.id });
        renderSched();
      };
      li.append(s, x);
      ul.append(li);
    }
  }
  for (const [label, text, time] of [[T.presetMorning, T.morningPrompt, '09:00'], [T.presetEvening, T.eveningPrompt, '18:00']]) {
    const b = el('button', 'chip', label);
    b.type = 'button';
    b.onclick = () => {
      $('s-kind').value = 'task';
      $('s-when').value = 'weekdays';
      $('s-time').value = time;
      $('s-text').value = text;
      $('s-folder').value = '';
      schedForm();
    };
    $('s-presets').append(b);
  }
  $('open-sched').onclick = () => {
    const sel = $('s-folder');
    sel.textContent = '';
    sel.append(Object.assign(el('option', '', `🗂 ${T.assistant}`), { value: '' }));
    for (const f of list.folders) if (f !== list.assistantFolder) sel.append(Object.assign(el('option', '', f), { value: f }));
    $('s-status').textContent = '';
    schedForm();
    renderSched();
    $('sched').showModal();
  };
  $('s-close').onclick = () => $('sched').close();
  $('s-add').onclick = async () => {
    const type = $('s-when').value;
    const when = type === 'in' ? { type, minutes: Number($('s-min').value) } : { type, time: $('s-time').value };
    const r = await api('/api/schedule/add', { kind: $('s-kind').value, text: $('s-text').value, cwd: $('s-folder').value, when });
    if (!r || !r.ok) return ($('s-status').textContent = T.schedBad);
    $('s-text').value = '';
    $('s-status').textContent = T.saved;
    renderSched();
  };

  // ---- Live: the pet's state (requests, agents) and the chats' stream.
  function connect() {
    const s = new EventSource('/stream');
    s.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type !== 'state') return;
      const before = JSON.stringify([state && state.permissions, state && state.questions]);
      state = m;
      config = m.config || config;
      if (JSON.stringify([m.permissions, m.questions]) !== before) render();
    };
  }
  async function connectChats() {
    if (!key) key = desk && desk.contactKey ? await desk.contactKey().catch(() => null) : null;
    if (!key) return;
    const s = new EventSource(`/api/chat/stream?key=${encodeURIComponent(key)}`);
    s.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type !== 'chat') return;
      const mine = view.kind === 'chat' && current && m.id === current.id;
      if (m.op === 'list' || m.op === 'status') refreshList();
      if (!mine) return;
      if (m.op === 'delta') {
        draft += m.text;
        const live = document.querySelector('.msg.live');
        if (live) {
          live.innerHTML = markdown(draft);
          const log = $('log');
          if (log.scrollHeight - log.scrollTop - log.clientHeight < 120) log.scrollTop = log.scrollHeight;
        } else render();
      } else if (m.op === 'message') {
        if (m.message.role === 'assistant') draft = '';
        current.messages = [...(current.messages || []), m.message];
        render();
      } else if (m.op === 'activity') {
        current.activity = m.activity;
        const d = document.querySelector('.doing');
        if (d) d.textContent = m.activity.kind === 'tool' ? m.activity.text : m.activity.kind === 'waking' ? T.waking : T.thinking;
        else render();
      } else if (m.op === 'status') {
        current.status = m.status;
        current.costUsd = m.costUsd;
        if (m.status === 'idle') draft = '';
        render();
      }
    };
  }
  // A conversation open elsewhere is read from its file: every 2 s.
  setInterval(async () => {
    if (view.kind !== 'agent' || document.hidden) return;
    const r = await api(`/api/chat/agent?session=${encodeURIComponent(view.session)}`);
    if (!r) return;
    const changed = !current || JSON.stringify(r.messages) !== JSON.stringify(current.messages) || r.state !== current.state;
    current = r;
    if (changed) render();
  }, 2000);
  setInterval(() => !document.hidden && refreshList(), 5000);

  (async () => {
    renderChips();
    connect();
    await connectChats();
    await refreshList();
    await load();
    if (desk && desk.call) {
      const s = await fetch('/api/state').then((r) => r.json()).catch(() => null);
      if (s) {
        state = s;
        config = s.config || {};
        // Your Openmon, who answers here.
        const p = !s.demo && s.pet;
        if (p && p.formKey) {
          petArt = `/art/${encodeURIComponent(p.formKey)}.svg`;
          $('me').onload = () => ($('me').hidden = false);
          $('me').src = petArt;
          $('me').title = p.name || '';
        }
        renderChips();
        render();
      }
    }
    tellViewing();
    $('text').focus();
  })();
</script>
</body>
</html>
