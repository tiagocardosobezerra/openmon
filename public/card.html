<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<title>Trainer card</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding: 8px 0 48px; }
  .hero { padding-bottom: 14px; }
  canvas { width: 100%; height: auto; border-radius: 20px; border: 2.5px solid var(--outline); box-shadow: 0 5px 0 var(--outline), 0 16px 40px rgba(0,0,0,0.16); display: block; }
  .actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .card-mode { display: inline-flex; margin: 0 0 12px; padding: 3px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); }
  #msg { color: var(--muted); min-height: 1.5em; margin-top: 10px; text-align: center; }
</style>
</head>
<body class="page" data-page="card">
<main class="wrap">
  <div class="hero"><div><h1 id="title"></h1><p id="sub"></p></div></div>
  <div class="seg pick card-mode" role="radiogroup" id="mode"></div>
  <canvas id="card" width="1200" height="630"></canvas>
  <div class="actions">
    <button id="copy" class="btn primary"></button>
    <button id="save" class="btn"></button>
  </div>
  <div id="msg"></div>
</main>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="art.js"></script>
<script src="motion.js"></script>
<script>
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const INK = OpenmonArt.INK;
  const { t: tr, lang } = window.OpenmonI18n;
  document.documentElement.lang = lang;
  document.getElementById('save').textContent = tr('card.save');
  document.getElementById('copy').textContent = tr('card.copy');
  document.getElementById('title').textContent = tr('nav.card');
  document.getElementById('sub').textContent = tr('card.pageSub');
  let data = null;
  const logo = new Image();
  logo.src = '/brand/logo-full.svg';
  let species = null;

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function radar(cx, cy, r, values, labels, color) {
    const n = values.length;
    const pt = (i, k) => [cx + Math.cos(-Math.PI / 2 + (i * 2 * Math.PI) / n) * r * k, cy + Math.sin(-Math.PI / 2 + (i * 2 * Math.PI) / n) * r * k];
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(42,33,64,0.18)';
    for (const k of [0.33, 0.66, 1]) {
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx[i ? 'lineTo' : 'moveTo'](...pt(i, k));
      ctx.closePath();
      ctx.stroke();
    }
    const max = Math.max(0.0001, ...values);
    ctx.beginPath();
    values.forEach((v, i) => ctx[i ? 'lineTo' : 'moveTo'](...pt(i, 0.12 + 0.88 * (v / max))));
    ctx.closePath();
    ctx.fillStyle = color + 'aa';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.font = '700 20px system-ui, sans-serif';
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    labels.forEach((l, i) => ctx.fillText(l, ...pt(i, 1.22)));
  }

  function render(t) {
    const p = data.pet;
    const key = p.lineage || 'plain';
    const pal = (p.shiny && p.stage !== 'egg' && OpenmonArt.SHINY[key]) || OpenmonArt.PALETTES[key] || OpenmonArt.PALETTES.plain;
    // Background.
    const g = ctx.createLinearGradient(0, 0, 1200, 630);
    g.addColorStop(0, pal.glow);
    g.addColorStop(1, pal.body);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1200, 630);
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 14; i++) {
      ctx.beginPath();
      ctx.arc((i * 173) % 1200, (i * 97) % 630, 30 + (i % 4) * 22, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Card.
    roundRect(40, 40, 1120, 550, 34);
    ctx.fillStyle = '#fffdf7';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = INK;
    ctx.stroke();

    // Pet stage.
    ctx.save();
    roundRect(70, 70, 470, 490, 26);
    ctx.clip();
    const sg = ctx.createRadialGradient(305, 330, 40, 305, 330, 320);
    sg.addColorStop(0, '#ffffff');
    sg.addColorStop(1, pal.belly);
    ctx.fillStyle = sg;
    ctx.fillRect(70, 70, 470, 490);
    ctx.translate(305, 470);
    ctx.scale(2.6, 2.6);
    const spec = { stage: p.stage, lineage: p.lineage, trait: p.trait, chimera: p.chimera, shiny: p.shiny, legend: p.legend || null, progress: p.progress.ratio, wear: p.wear || null };
    const anim = OpenmonMotion.poseAnim({ ...spec, pose: 'done', t: t + 3, since: 0 });
    OpenmonArt.drawCreature(ctx, { ...spec, t, size: 46, pose: 'idle', anim });
    ctx.restore();
    roundRect(70, 70, 470, 490, 26);
    ctx.lineWidth = 4;
    ctx.strokeStyle = INK;
    ctx.stroke();

    if (mode === 'month') {
      renderMonth(p);
      footer();
      return;
    }

    // Text.
    const days = Math.max(1, Math.ceil((Date.now() - p.bornAt) / 86400000));
    const nature = species.natures[p.nature] ? species.natures[p.nature].label : '';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#6d6680';
    ctx.font = '700 22px system-ui, sans-serif';
    ctx.fillText(`#${String(p.dexNo).padStart(3, '0')} · LV ${p.level || 1} · GEN ${p.generation || 1} · ${tr(`stage.${p.stage}`).toUpperCase()}${p.shiny && p.stage !== 'egg' ? ` · ${tr('card.shinyTag')}` : ''}`, 580, 115);
    ctx.fillStyle = INK;
    ctx.font = '900 64px system-ui, sans-serif';
    ctx.fillText(p.name + (p.shiny ? ' ★' : ''), 578, 182);
    ctx.font = '600 30px system-ui, sans-serif';
    if (p.nickname) ctx.fillText(p.form, 580, 224);
    ctx.fillStyle = '#6d6680';
    ctx.font = '500 22px system-ui, sans-serif';
    ctx.fillText(tr('card.meta', { nature, days: days > 1 ? tr('card.days', { n: days }) : tr('card.day'), bond: p.bond }), 580, 260);

    // Eleven axes do not fit: the six strongest kinds of work, in their usual order.
    const top = new Set([...species.stats].sort((a, b) => (p.affinity[b] || 0) - (p.affinity[a] || 0)).slice(0, 6));
    const axes = species.stats.filter((s) => top.has(s));
    radar(760, 402, 86, axes.map((s) => p.affinity[s] || 0), axes.map((s) => species.statLabels[s]), pal.body);

    const seen = Object.keys(p.dex || {}).length;
    const facts = [
      [p.counters.tools.toLocaleString(lang), tr('card.toolCalls')],
      [p.counters.testsGreen.toLocaleString(lang), tr('card.greenRuns')],
      [`${seen}/${species.dex.length}`, 'Opendex'],
      [String(Object.keys(p.achievements || {}).length), tr('card.badges')],
    ];
    facts.forEach(([v, l], i) => {
      const x = 970;
      const y = 320 + i * 62;
      ctx.textAlign = 'left';
      ctx.fillStyle = INK;
      ctx.font = '800 30px system-ui, sans-serif';
      ctx.fillText(v, x, y);
      ctx.fillStyle = '#6d6680';
      ctx.font = '600 17px system-ui, sans-serif';
      ctx.fillText(l, x, y + 22);
    });

    footer();
  }

  function footer() {
    ctx.fillStyle = '#6d6680';
    ctx.font = '600 18px system-ui, sans-serif';
    ctx.textAlign = 'right';
    if (logo.complete && logo.naturalWidth) {
      const lh = 28;
      const lw = (logo.naturalWidth / logo.naturalHeight) * lh;
      ctx.drawImage(logo, 1130 - lw, 542, lw, lh);
      ctx.fillText(tr('card.footer').replace(/^openmon · /, ''), 1130 - lw - 14, 563);
    } else ctx.fillText(tr('card.footer'), 1130, 570);
  }

  // The month with your Openmon: the last 30 days of the journal in six numbers.
  function renderMonth(p) {
    const since = Date.now() - 30 * 86400000;
    const keyOf = (ms) => {
      const d = new Date(ms);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const days = (p.journal || []).filter((e) => e.day >= keyOf(since));
    const sum = (k) => days.reduce((a, e) => a + (e[k] || 0), 0);
    const tests = sum('green') + sum('red');
    const fam = {};
    for (const e of days) for (const [k, n] of Object.entries(e.families || {})) fam[k] = (fam[k] || 0) + n;
    const topType = Object.entries(fam).sort((a, b) => b[1] - a[1])[0];
    const hours = days.reduce((a, e) => a + Object.values(e.agentMs || {}).reduce((x, y) => x + y, 0), 0) / 3600000;
    const newForms = Object.values(p.dex || {}).filter((at) => at >= since).length;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#6d6680';
    ctx.font = '700 22px system-ui, sans-serif';
    ctx.fillText(tr('month.kicker', { month: new Date().toLocaleDateString(lang, { month: 'long', year: 'numeric' }) }).toUpperCase(), 580, 115);
    // As big as fits on the card.
    ctx.fillStyle = INK;
    const title = tr('month.title', { name: p.name });
    let size = 54;
    do ctx.font = `900 ${size}px system-ui, sans-serif`;
    while (ctx.measureText(title).width > 540 && (size -= 2) > 26);
    ctx.fillText(title, 578, 172);
    if (newForms) {
      ctx.fillStyle = '#6d6680';
      ctx.font = '600 22px system-ui, sans-serif';
      ctx.fillText(tr('month.newForms', { n: newForms }), 580, 212);
    }
    const tiles = [
      [sum('tools').toLocaleString(lang), tr('month.actions')],
      [sum('turns').toLocaleString(lang), tr('month.requests')],
      [tests ? `${Math.round((sum('green') / tests) * 100)}%` : '–', tr('month.green')],
      [hours >= 0.05 ? `${hours.toFixed(hours < 10 ? 1 : 0)} h` : '–', tr('month.hours')],
      [topType ? species.statLabels[topType[0]] || topType[0] : '–', tr('month.topType')],
      [`${days.filter((e) => e.tools).length}`, tr('month.days')],
    ];
    tiles.forEach(([v, l], i) => {
      const x = 580 + (i % 3) * 186;
      const y = 250 + Math.floor(i / 3) * 140;
      roundRect(x, y, 170, 118, 18);
      ctx.fillStyle = '#f4efe6';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = INK;
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.font = '800 34px system-ui, sans-serif';
      ctx.fillText(v, x + 16, y + 52);
      ctx.fillStyle = '#6d6680';
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText(l, x + 16, y + 84);
    });
  }

  let mode = 'card';
  function renderMode() {
    const box = document.getElementById('mode');
    box.textContent = '';
    for (const [m, label] of [['card', tr('month.cardTab')], ['month', tr('month.tab')]]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-selected', String(m === mode));
      b.onclick = () => {
        mode = m;
        renderMode();
      };
      box.append(b);
    }
  }
  renderMode();

  async function main() {
    [species, data] = await Promise.all([fetch(`/api/species?lang=${lang}`).then((r) => r.json()), fetch('/api/state').then((r) => r.json())]);
    OpenmonMotion.loop((ms) => render(ms / 1000));
  }

  const msg = (text) => (document.getElementById('msg').textContent = text);
  document.getElementById('save').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(data.pet.name || 'openmon').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-card.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      msg(tr('card.saved'));
    });
  });
  document.getElementById('copy').addEventListener('click', () => {
    // In the app: through the desktop shell. In a browser: its clipboard.
    const desk = window.openmonSettings;
    if (desk && desk.copyImage) {
      desk.copyImage(canvas.toDataURL('image/png')).then((ok) => msg(tr(ok ? 'card.copied' : 'card.copyFail'))).catch(() => msg(tr('card.copyFail')));
      return;
    }
    canvas.toBlob(async (blob) => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        msg(tr('card.copied'));
      } catch {
        msg(tr('card.copyFail'));
      }
    });
  });
  OpenmonArt.loadPack().then(main).catch(() => msg(tr('card.start')));
</script>
</body>
</html>
