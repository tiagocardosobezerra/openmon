  main { padding-bottom: 56px; }
  .lead { font-size: 16px; max-width: 64ch; }

  .pose { padding: 10px 12px 14px; text-align: center; }
  .pose canvas { width: 120px; height: 120px; }
  .pose b { display: block; font: 600 15px var(--font-display); margin-top: 4px; }
  .pose span { font-size: 13px; color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .step { padding: 14px 16px; }
  .step .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--sun); color: #2a2140; font: 600 15px var(--font-display); box-shadow: 0 0 0 2px var(--outline); }
  .step h3 { margin: 8px 0 4px; font-size: 17px; }
  .step p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .faq { display: grid; gap: 8px; max-width: 760px; }
  details { padding: 10px 14px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r-md); }
  details[open] { border-color: var(--outline); }
  summary { cursor: pointer; font: 600 15px var(--font-display); }
  details p { margin: 8px 0 2px; color: var(--muted); }

<script>
  const { lang } = window.OpenmonI18n;
  const pt = lang === 'pt-BR';
  document.documentElement.lang = lang;
  const T = pt
    ? {
        title: 'Como funciona',
        lead: 'O Openmon é um bichinho que mora no canto da tela e mostra, num olhar, o que o seu agente de IA (como o Claude Code) está fazendo. Quando o agente precisa de você, ele avisa. E, com o tempo, ele cresce e evolui.',
        poses: 'O que ele está dizendo',
        steps: 'O que você pode fazer',
        faq: 'Perguntas frequentes',
        pose: [
          ['attention', 'Pulando com a placa', 'Seu agente precisa de você (uma permissão ou uma pergunta). Clique nele para ir direto.'],
          ['working', 'Com uma ferramenta', 'Seu agente está trabalhando: martelo é editar, livro é ler, escudo é testar.'],
          ['done', 'Comemorando', 'Seu agente terminou e é a sua vez de responder.'],
          ['error', 'Fazendo careta', 'Algo deu errado, como um teste que falhou.'],
          ['sleep', 'Dormindo', 'Nada acontecendo há alguns minutos.'],
        ],
        step: [
          ['Clique', 'Faz carinho. Se ele estiver segurando a placa, leva você até a janela do agente.'],
          ['Botão direito', 'Abre o card: seus agentes, as missões do dia, os tipos de trabalho e os atalhos. Em Mais ficam as páginas e as configurações.'],
          ['Arraste', 'Leve ele para qualquer canto da tela. Ele lembra onde ficou.'],
          ['Deixe ele crescer', 'Cada coisa que seu agente faz vale experiência (XP). Com o bastante, ele evolui. O tipo dele depende do trabalho que o agente mais faz.'],
          ['Cumpra missões', 'Três por dia, como "responder rápido 3 vezes". Elas dão biscoitos e experiência. Os itens ficam na Mochila.'],
          ['Ganhe acessórios', 'Chapéus, cachecóis e outros, liberados por conquistas. Coloque pela Mochila.'],
        ],
        q: [
          ['Posso aprovar ou recusar pelo pet?', 'Pode. Botão direito → Mais → Configurações → "Responder permissões pelo pet". O balão ganha Permitir e Recusar, e o Claude Code espera sua resposta no pet por até 25 segundos; depois disso ele pergunta como sempre.'],
          ['Ele deixa meu agente mais lento?', 'Não. Ele só escuta os avisos que o Claude Code já manda, sem bloquear nada, e não digita nada por você.'],
          ['Ele manda meu código para algum lugar?', 'Não. Tudo fica no seu computador e ele não coleta dados. Só usa a internet se você ligar o aviso no celular (manda só "Seu agente precisa de você") ou o GitHub (guarda seu pet num Gist secreto da sua conta). Senhas e chaves aparecem escondidas (•••).'],
          ['Como deixo ele em silêncio?', 'Botão direito → Mais → Modo silencioso (30 minutos, 1 hora ou até amanhã), ou desligue Sons e Falas nas Configurações.'],
          ['Ele está me atrapalhando. Dá para esconder?', 'Sim: no ícone da bandeja, desmarque "Mostrar pet". Em Configurações também dá para mudar o tamanho e desligar o passeio pela tela.'],
          ['Formatei o computador. Perdi meu pet?', 'Não, se a pasta Documentos estiver no OneDrive (ou outro backup). Ele guarda cópias em Documentos/Openmon Backups e, numa instalação nova, pergunta se você quer trazê-lo de volta.'],
          ['Como removo?', 'No terminal: openmon uninstall (tira os avisos do Claude Code) e depois desinstale o app. Seu pet fica guardado, caso queira voltar.'],
          ["Como ganho novos Openmons?", "De quatro jeitos. 1) Projeto novo: quando o agente faz 60 ações num projeto, aquele projeto ganha o seu próprio ovo (veja em Time → \"Ovos a caminho\"). 2) Ovo misterioso: vem a cada 30 dias seguidos de uso; choque pela Mochila. Ele não tem projeto: para crescer, faça dele o principal no Time ou coloque-o na tela com \"Também na tela\". Com mais de um na tela, cada sessão de agente sem pet próprio vai para um deles, o que tiver menos sessões. Isso porque o principal (o da tela) treina com todo trabalho que não tem um Openmon próprio. No Ninho, eles descansam e não ganham XP. 3) Lendários: Mergeon (primeiro pull request aceito), Aeonbyte (um ano de Openmon) e Zeroday (100 consertos) entram sozinhos no seu Time. 4) Nova geração: quando o seu chega a Ancião, aposente-o no Hall da Fama (menu do ícone da bandeja) e ele deixa um ovo. Até 6 ficam no Time; os outros vão para o Ninho."],
          ["Qual a chance de vir brilhante?", "Cada ovo tem 1 chance em 128 de nascer brilhante, sorteada quando ele aparece. O ovo misterioso tem 1 em 16. O brilhante tem outras cores e sempre um brilho dourado com estrelinhas em volta, em todas as formas e poses."],
          ["Quando ele evolui?", "Pela experiência (XP) que o trabalho do agente dá: o ovo choca como jovem com 400 XP (o inicial que você escolhe choca com 30), adulto com 3.000 e ancião com 15.000 e amizade 60. A barra no card mostra quanto falta. O tipo é decidido de novo em cada evolução (jovem, adulto e ancião), pelo trabalho que ele mais recebeu até ali; o inicial que você escolheu mantém o tipo para sempre. Cada pet ganha no máximo 120 XP a cada 10 minutos de trabalho, para que loops não contem demais; missões e balas não entram nesse limite. A Pedra firme, segurada, impede a evolução (um ovo ainda choca). Lendários nunca evoluem."],
          ["Como aparece a Chimera?", "Chimera (oculta): na evolução para Adulto ou Ancião, os dois tipos mais fortes quase empatados (menos de 4% de diferença)."],
          ["Como ganho itens?", "Biscoito: um por missão e um por dia de uso. Bala de nível: por dia perfeito (as 3 missões) e a cada 7 dias seguidos. Pedra de tipo: a cada 3 dias seguidos, do trabalho que o agente mais fez. Amuleto de XP: a cada 14 dias seguidos. Ovo misterioso: a cada 30. Doce de amizade: ao fazer 10 carinhos num dia. Os itens são usados no Openmon que está na tela. A Mochila é do time todo: uma pedra que um pet segura não fica livre para outro, e volta para a Mochila se ele se aposentar. Quem não evolui mais (Ancião ou lendário) não segura pedras, e a Mochila não gasta biscoito com amizade cheia nem bala no nível 100."],
          ["Quem ganha a experiência quando tenho vários Openmons?", "Quem acompanha cada conversa, nesta ordem: 1) uma conversa que você fixou num Openmon (botão direito → Agentes → clique no nome do pet ao lado da conversa); 2) um projeto que você fixou num Openmon (Time → \"Acompanha\"); 3) o Openmon do próprio projeto, enquanto ele está no Time; 4) a fila: com mais de um na tela, cada conversa nova vai para um deles, na vez de cada um. Em Configurações → Pet dá para desligar a divisão; aí tudo fica com o principal, menos o que você fixou. No Ninho, os pets descansam e não ganham XP. Lendários ganham nível, mas nunca evoluem. É de cada pet: nível, tipo, amizade, acessórios que está usando e o item que segura. É do time todo: Mochila, Opendex, insígnias, acessórios ganhos, missões e dias seguidos. O Amuleto de XP vale para o time todo."],
          ["Posso ter mais de um Openmon na tela?", "Sim, até mais 2 do Time ao lado do principal (Time → \"Também na tela\"). Clique num deles para fazer carinho: a amizade é só dele. \"Colocar na tela\" troca qual é o principal. Mandar para o Ninho tira ele da tela. Para um pet seguir sempre um projeto, use \"Acompanha\" no Time."],
          ["O que acontece quando aposento um Openmon?", "Só o Openmon na tela, no estágio Ancião e que não seja lendário, pode se aposentar, pelo menu do ícone da bandeja (ele pergunta antes). Ele vai para o Hall da Fama na Opendex e bota um ovo no mesmo lugar do Time e no mesmo projeto. O ovo começa com um décimo dos atributos dele e mantém Opendex, insígnias, Mochila, acessórios ganhos, missões do dia, dias seguidos e diário."],
          ["Como libero os acessórios?", "Cada acessório bloqueado mostra na Mochila o que fazer e quanto falta. Alguns dependem da época: o chapéu de abóbora em outubro e o gorro de Natal em dezembro. A mochilinha pede um de cada tipo de item (qualquer pedra de tipo vale). Uma vez ganho, o acessório é seu para sempre, em todas as gerações."],
          ['O que é a Opendex?', 'Um álbum com todas as formas que um Openmon pode ter. As que você já viu aparecem coloridas; as outras ficam em silhueta.'],
          ['Ele pode morrer ou ficar doente?', 'Nunca. Ele também nunca perde o que conquistou. A amizade só sobe.'],
        ],
      }
    : lang === 'es'
    ? {
        title: 'Cómo funciona',
        lead: 'Openmon es una criaturita que vive en una esquina de la pantalla y muestra, de un vistazo, lo que hace tu agente de IA (como Claude Code). Cuando el agente te necesita, te avisa. Y, con el tiempo, crece y evoluciona.',
        poses: 'Lo que te está diciendo',
        steps: 'Lo que puedes hacer',
        faq: 'Preguntas frecuentes',
        pose: [
          ['attention', 'Saltando con el cartel', 'Tu agente te necesita (un permiso o una pregunta). Haz clic en él para ir directo.'],
          ['working', 'Con una herramienta', 'Tu agente está trabajando: el martillo es editar, el libro es leer, el escudo es probar.'],
          ['done', 'Celebrando', 'Tu agente terminó y te toca responder.'],
          ['error', 'Haciendo una mueca', 'Algo salió mal, como una prueba que falló.'],
          ['sleep', 'Durmiendo', 'No pasa nada desde hace unos minutos.'],
        ],
        step: [
          ['Clic', 'Lo acaricias. Si sostiene el cartel, te lleva a la ventana del agente.'],
          ['Clic derecho', 'Abre su tarjeta: tus agentes, las misiones del día, los tipos de trabajo y los atajos. En Más están las páginas y los ajustes.'],
          ['Arrastrar', 'Llévalo a cualquier rincón de la pantalla. Recuerda dónde quedó.'],
          ['Déjalo crecer', 'Todo lo que hace tu agente vale experiencia (XP). Con suficiente, evoluciona. Su tipo depende del trabajo que más hace el agente.'],
          ['Cumple misiones', 'Tres por día, como "responder rápido 3 veces". Dan galletas y experiencia. Los objetos van a la Mochila.'],
          ['Gana accesorios', 'Gorros, bufandas y más, desbloqueados con logros. Póntelos desde la Mochila.'],
        ],
        q: [
          ['¿Puedo aprobar o rechazar desde la mascota?', 'Sí. Clic derecho → Más → Ajustes → "Responder permisos desde la mascota". El globo muestra Permitir y Rechazar, y Claude Code espera tu respuesta en la mascota hasta 25 segundos; después pregunta como siempre.'],
          ['¿Hace más lento a mi agente?', 'No. Solo escucha los avisos que Claude Code ya envía, no bloquea nada y no escribe nada por ti.'],
          ['¿Envía mi código a algún lugar?', 'No. Todo queda en tu computadora y no recoge datos. Solo usa internet si activas el aviso en el celular (solo envía "Tu agente te necesita") o GitHub (guarda tu mascota en un Gist secreto de tu cuenta). Las contraseñas y claves aparecen ocultas (•••).'],
          ['¿Cómo lo silencio?', 'Clic derecho → Más → Modo silencioso (30 minutos, 1 hora o hasta mañana), o apaga Sonidos y Charla en Ajustes.'],
          ['Me estorba. ¿Puedo esconderlo?', 'Sí: en el icono de la bandeja, desmarca "Mostrar mascota". En Ajustes también puedes cambiar su tamaño y apagar el paseo por la pantalla.'],
          ['Formateé la computadora. ¿Perdí mi mascota?', 'No, si tu carpeta Documentos está en OneDrive (u otra copia). Guarda copias en Documentos/Openmon Backups y, en una instalación nueva, pregunta si quieres traerla de vuelta.'],
          ['¿Cómo lo quito?', 'En una terminal: openmon uninstall (quita los avisos de Claude Code) y luego desinstala la app. Tu mascota queda guardada por si vuelves.'],
          ["¿Cómo consigo nuevos Openmons?", "De cuatro formas. 1) Proyecto nuevo: cuando el agente hace 60 acciones en un proyecto, ese proyecto gana su propio huevo (mira Equipo → \"Huevos en camino\"). 2) Huevo misterioso: llega cada 30 días seguidos de uso; ábrelo desde la Mochila. No tiene proyecto: para que crezca, hazlo el principal en el Equipo o ponlo en pantalla con \"También en pantalla\". Con más de uno en pantalla, cada sesión de agente sin mascota propia va a uno de ellos, el que tenga menos sesiones. Esto es porque el principal (el de la pantalla) entrena con todo trabajo que no tiene un Openmon propio. En el Nido descansan y no ganan XP. 3) Legendarios: Mergeon (primer pull request aceptado), Aeonbyte (un año de Openmon) y Zeroday (100 arreglos) se unen solos a tu equipo. 4) Nueva generación: cuando el tuyo llega a Anciano, retíralo al Salón de la Fama (menú del icono de la bandeja) y deja un huevo. Hasta 6 van en el Equipo; los demás, en el Nido."],
          ["¿Qué probabilidad hay de un shiny?", "Cada huevo tiene 1 en 128 de nacer shiny, sorteado cuando aparece. El huevo misterioso tiene 1 en 16. El shiny tiene otros colores y siempre un brillo dorado con estrellitas alrededor, en todas sus formas y poses."],
          ["¿Cuándo evoluciona?", "Por la experiencia (XP) del trabajo del agente: el huevo eclosiona como joven con 400 XP (el inicial que eliges, con 30), adulto con 3.000 y anciano con 15.000 y amistad 60. La barra del card muestra cuánto falta. El tipo se decide de nuevo en cada evolución (joven, adulto y anciano), por el trabajo que más recibió hasta ahí; el inicial que elegiste mantiene su tipo para siempre. Cada mascota gana como máximo 120 XP cada 10 minutos de trabajo, para que los bucles no cuenten de más; las misiones y los caramelos no entran en ese límite. La Piedra firme, sostenida, impide evolucionar (un huevo igual se abre). Los legendarios nunca evolucionan."],
          ["¿Cómo aparece la Chimera?", "Chimera (oculta): al evolucionar a Adulto o Anciano, los dos tipos más fuertes casi empatados (menos de 4% de diferencia)."],
          ["¿Cómo consigo objetos?", "Galleta: una por misión y una por día de uso. Caramelo de nivel: por día perfecto (las 3 misiones) y cada 7 días seguidos. Piedra de tipo: cada 3 días seguidos, del trabajo que más hizo el agente. Amuleto de XP: cada 14 días seguidos. Huevo misterioso: cada 30. Dulce de amistad: al acariciarlo 10 veces en un día. Los objetos se usan en el Openmon que está en pantalla. La Mochila es de todo el equipo: una piedra que sostiene una mascota no queda libre para otra, y vuelve a la Mochila si se retira. Quien ya no evoluciona (Anciano o legendario) no sostiene piedras, y la Mochila no gasta galletas con la amistad llena ni caramelos en el nivel 100."],
          ["¿Quién gana la experiencia cuando tengo varios Openmons?", "Quién acompaña cada conversación, en este orden: 1) una conversación que fijaste en un Openmon (clic derecho → Agentes → clic en el nombre de la mascota junto a la conversación); 2) un proyecto que fijaste en un Openmon (Equipo → \"Acompaña\"); 3) el Openmon del propio proyecto, mientras está en el Equipo; 4) la fila: con más de uno en pantalla, cada conversación nueva va a uno de ellos, por turno. En Ajustes → Mascota puedes apagar el reparto; entonces todo queda con el principal, salvo lo que fijaste. En el Nido, las mascotas descansan y no ganan XP. Los legendarios suben de nivel, pero nunca evolucionan. Es de cada mascota: nivel, tipo, amistad, accesorios que lleva puestos y el objeto que sostiene. Es de todo el equipo: Mochila, Opendex, insignias, accesorios ganados, misiones y días seguidos. El Amuleto de XP vale para todo el equipo."],
          ["¿Puedo tener más de un Openmon en pantalla?", "Sí, hasta 2 más del Equipo junto al principal (Equipo → \"También en pantalla\"). Haz clic en uno para acariciarlo: la amistad es solo suya. \"Poner en pantalla\" cambia cuál es el principal. Mandarlo al Nido lo saca de la pantalla. Para que una mascota siga siempre un proyecto, usa \"Acompaña\" en el Equipo."],
          ["¿Qué pasa cuando retiro un Openmon?", "Solo el Openmon en pantalla, en la etapa Anciano y que no sea legendario, puede retirarse, desde el menú del icono de la bandeja (pregunta antes). Va al Salón de la Fama en la Opendex y pone un huevo en el mismo lugar del Equipo y en el mismo proyecto. El huevo empieza con una décima parte de sus atributos y conserva Opendex, insignias, Mochila, accesorios ganados, misiones del día, días seguidos y diario."],
          ["¿Cómo desbloqueo los accesorios?", "Cada accesorio bloqueado muestra en la Mochila qué hacer y cuánto falta. Algunos dependen de la época: el sombrero de calabaza en octubre y el gorro de Navidad en diciembre. La mochilita pide uno de cada tipo de objeto (cualquier piedra de tipo cuenta). Una vez ganado, el accesorio es tuyo para siempre, en todas las generaciones."],
          ['¿Qué es la Opendex?', 'Un álbum con todas las formas que puede tener un Openmon. Las que ya viste aparecen en color; las demás, en silueta.'],
          ['¿Puede morir o enfermarse?', 'Nunca. Tampoco pierde lo que ganó. La amistad solo sube.'],
        ],
      }
    : {
        title: 'How Openmon works',
        lead: 'Openmon is a little creature that lives in the corner of your screen and shows, at a glance, what your AI coding agent (such as Claude Code) is doing. When the agent needs you, it tells you. Over time, it grows and evolves.',
        poses: 'What it is telling you',
        steps: 'What you can do',
        faq: 'Questions',
        pose: [
          ['attention', 'Jumping with a sign', 'Your agent needs you (a permission or a question). Click it to go straight there.'],
          ['working', 'Holding a tool', 'Your agent is working: a hammer means editing, a book reading, a shield testing.'],
          ['done', 'Celebrating', 'Your agent finished and it is your turn to reply.'],
          ['error', 'Wincing', 'Something went wrong, like a failed test.'],
          ['sleep', 'Sleeping', 'Nothing has happened for a few minutes.'],
        ],
        step: [
          ['Click', 'Pets it. If it holds the sign, takes you to the agent\'s window.'],
          ['Right-click', 'Opens its card: your agents, today\'s missions, kinds of work and shortcuts. More has the pages and the settings.'],
          ['Drag', 'Put it in any corner of the screen. It remembers where.'],
          ['Let it grow', 'Everything your agent does is worth experience (XP). With enough, it evolves. Its type depends on the work your agent does most.'],
          ['Do missions', 'Three a day, like "answer quickly 3 times". They give snacks and experience. Items go to the Bag.'],
          ['Earn accessories', 'Hats, scarves and more, unlocked by achievements. Put them on from the Bag.'],
        ],
        q: [
          ['Can I approve or deny from the pet?', 'Yes. Right-click → More → Settings → "Answer permissions from the pet". The bubble gets Allow and Deny, and Claude Code waits for your answer on the pet for up to 25 seconds; after that it asks you as usual.'],
          ['Does it slow my agent down?', 'No. It only listens to the notices Claude Code already sends, never blocks anything and never types for you.'],
          ['Does it send my code anywhere?', 'No. Everything stays on your computer and it collects no data. It only goes online if you turn on phone alerts (they only say "Your agent needs you") or GitHub (your pet in a secret Gist in your account). Passwords and keys show hidden (•••).'],
          ['How do I make it quiet?', 'Right-click → More → Quiet mode (30 minutes, 1 hour or until tomorrow), or turn Sounds and Chatter off in Settings.'],
          ['It is in my way. Can I hide it?', 'Yes: in the tray icon, untick "Show pet". Settings also change its size and turn off walking around.'],
          ['I reinstalled my computer. Is my pet gone?', 'No, if your Documents folder is on OneDrive (or another backup). It keeps copies in Documents/Openmon Backups and, on a fresh install, offers to bring it back.'],
          ['How do I remove it?', 'In a terminal: openmon uninstall (removes the Claude Code notices), then uninstall the app. Your pet is kept in case you come back.'],
          ["How do I get new Openmons?", "Four ways. 1) A new project: when your agent does 60 actions in a project, that project gets its own egg (see Party → \"Eggs on the way\"). 2) Mystery egg: one every 30 days in a row; hatch it from the Bag. It has no project: to grow it, make it the main one in the Party or put it on screen with \"Also on screen\". With more than one on screen, each agent session without a pet of its own goes to one of them, the one with the fewest sessions. That is because the main pet (the one on screen) trains on all work without its own Openmon. In the Nest, pets rest and earn no XP. 3) Legendaries: Mergeon (first merged pull request), Aeonbyte (a year of Openmon) and Zeroday (100 fixes) join your team on their own. 4) A new generation: when yours becomes an Elder, retire it to the Hall of Fame (tray icon menu) and it leaves an egg. Up to 6 travel in your Party; the rest go to the Nest."],
          ["What are the odds of a shiny?", "Every egg has a 1 in 128 chance to be shiny, decided when it appears. A mystery egg has 1 in 16. A shiny has other colours and always a golden glow with little stars around it, in every form and pose."],
          ["When does it evolve?", "With the experience (XP) your agent's work gives: the egg hatches as a juvenile at 400 XP (the starter you choose, at 30), adult at 3,000 and elder at 15,000 plus friendship 60. The bar on the card shows how much is left. Its type is decided again at every evolution (juvenile, adult and elder), by the work it got most so far; the starter you chose keeps its type for life. Each pet earns at most 120 XP per 10 minutes of work, so loops cannot farm it; missions and candies are not part of that limit. Holding the Steady stone stops evolution (an egg still hatches). Legendaries never evolve."],
          ["How does a Chimera appear?", "Chimera (hidden): at the Adult or Elder evolution, the two strongest types almost tied (less than 4% apart)."],
          ["How do I get items?", "Snack: one per mission and one per day of use. Level candy: for a perfect day (all 3 missions) and every 7 days in a row. Type stone: every 3 days in a row, of the work your agent did most. XP charm: every 14 days in a row. Mystery egg: every 30. Friendship candy: pet it 10 times in a day. Items are used on the Openmon on screen. The Bag belongs to the whole team: a stone one pet holds is not free for another, and it goes back to the Bag if that pet retires. A pet that no longer evolves (Elder or legendary) holds no stones, and the Bag does not spend a snack at full friendship or a candy at level 100."],
          ["Who gets the experience when I have several Openmons?", "Who follows each conversation, in this order: 1) a conversation you pinned to an Openmon (right-click → Agents → click the pet's name next to the conversation); 2) a project you pinned to an Openmon (Party → \"Follows\"); 3) the project's own Openmon, while it is in the Party; 4) the queue: with more than one on screen, each new conversation goes to one of them, in turn. In Settings → Pet you can turn sharing off; then everything stays with the main one, except what you pinned. In the Nest, pets rest and earn no XP. Legendaries gain levels but never evolve. Each pet has its own level, type, friendship, worn accessories and held item. The whole team shares the Bag, the Opendex, badges, earned accessories, missions and your streak. The XP charm works for the whole team."],
          ["Can I have more than one Openmon on screen?", "Yes, up to 2 more from your Party next to the main one (Party → \"Also on screen\"). Click one to pet it: the friendship is its own. \"Put on screen\" changes which one is the main pet. Sending one to the Nest takes it off the screen. To have a pet always follow a project, use \"Follows\" in the Party."],
          ["What happens when I retire an Openmon?", "Only the Openmon on screen, at the Elder stage and not a legendary, can retire, from the tray icon menu (it asks first). It joins the Hall of Fame in the Opendex and lays an egg in the same Party slot and the same project. The egg starts with a tenth of its stats and keeps the Opendex, badges, Bag, earned accessories, today's missions, your streak and the journal."],
          ["How do I unlock accessories?", "Every locked accessory shows in the Bag what to do and how far along you are. Some depend on the season: the pumpkin hat in October and the Santa hat in December. The little backpack asks for one of every kind of item (any type stone counts). Once earned, an accessory is yours for good, in every generation."],
          ['What is the Opendex?', 'An album of every form an Openmon can take. The ones you have seen are in colour; the rest are silhouettes.'],
          ['Can it die or get sick?', 'Never. It never loses what it earned, either. Friendship only goes up.'],
        ],
      };
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  $('title').textContent = T.title;
  $('lead').textContent = T.lead;
  $('h-poses').textContent = T.poses;
  $('h-steps').textContent = T.steps;
  $('h-faq').textContent = T.faq;
  // Each pose is drawn live, with its props (sign, hammer…), like on your desk.
  const live = [];
  for (const [pose, title, text] of T.pose) {
    const card = el('div', 'pose panel soft');
    const canvas = el('canvas');
    card.append(canvas, el('b', '', title), el('span', '', text));
    $('poses').append(card);
    live.push({ canvas, pose });
  }
  function frame(ms) {
    const t = ms / 1000;
    const dpr = window.devicePixelRatio || 1;
    for (const { canvas, pose } of live) {
      if (canvas.width !== 120 * dpr) {
        canvas.width = 120 * dpr;
        canvas.height = 120 * dpr;
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const k = canvas.width / 200;
      ctx.setTransform(k, 0, 0, k, 100 * k, 186 * k);
      const spec = { stage: 'juvenile', lineage: 'craft', trait: null };
      const anim = OpenmonMotion.poseAnim({ pose, family: 'craft', t, since: Math.floor(t / 6) * 6, stage: spec.stage, nature: 'cheerful' });
      OpenmonArt.drawCreature(ctx, { ...spec, t, size: 60, pose, anim });
    }
    requestAnimationFrame(frame);
  }
  OpenmonArt.loadPack().then(() => requestAnimationFrame(frame));
  T.step.forEach(([title, text], i) => {
    const card = el('div', 'step panel soft');
    card.append(el('span', 'n', String(i + 1)), el('h3', '', title), el('p', '', text));
    $('steps').append(card);
  });
  for (const [q, a] of T.q) {
    const d = el('details');
    d.append(el('summary', '', q), el('p', '', a));
    $('faq').append(d);
  }
</script>
</body>
</html>
