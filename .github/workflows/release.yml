name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a
# GitHub Release (Windows .exe, macOS .dmg, Linux .AppImage).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/dist.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
